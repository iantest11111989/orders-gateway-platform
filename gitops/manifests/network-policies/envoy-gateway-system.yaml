# Baseline for envoy-gateway-system: deny ingress by default; allow its own pods and the
# nodes (kubelet, API server webhooks and service proxy). "The nodes" is an
# ipBlock, everything outside the pod range 10.244.0.0/16: on kindnet a
# deny-all would also drop the control-plane node's traffic to pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: envoy-gateway-system
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: envoy-gateway-system
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-nodes
  namespace: envoy-gateway-system
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        # Everything outside the pod network (kind's default 10.244.0.0/16):
        # on kind that's the nodes and the API server on the control plane.
        - ipBlock: {cidr: 0.0.0.0/0, except: [10.244.0.0/16]}
---
# Prometheus scrapes the controller and the proxies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-metrics
  namespace: envoy-gateway-system
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - {port: 19001, protocol: TCP}
---
# The public entry point: the proxies' HTTP and HTTPS listeners take traffic
# from anywhere (NodePort from the host, or pods that call the gateway).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-proxy-listeners
  namespace: envoy-gateway-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: proxy
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: 10080, protocol: TCP}
        - {port: 10443, protocol: TCP}
