# Baseline for cert-manager: deny ingress by default; allow its own pods and the
# nodes (kubelet, API server webhooks and service proxy). "The nodes" is an
# ipBlock, everything outside the pod range 10.244.0.0/16: on kindnet a
# deny-all would also drop the control-plane node's traffic to pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-nodes
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        # Everything outside the pod network (kind's default 10.244.0.0/16):
        # on kind that's the nodes and the API server on the control plane.
        - ipBlock: {cidr: 0.0.0.0/0, except: [10.244.0.0/16]}
---
# Prometheus scrapes cert-manager.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-metrics
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - {port: 9402, protocol: TCP}
