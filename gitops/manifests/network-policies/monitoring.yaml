# Baseline for monitoring: deny ingress by default; allow its own pods and the
# nodes (kubelet, API server webhooks and service proxy). "The nodes" is an
# ipBlock, everything outside the pod range 10.244.0.0/16: on kindnet a
# deny-all would also drop the control-plane node's traffic to pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-nodes
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        # Everything outside the pod network (kind's default 10.244.0.0/16):
        # on kind that's the nodes and the API server on the control plane.
        - ipBlock: {cidr: 0.0.0.0/0, except: [10.244.0.0/16]}
---
# The HTTPRoutes for Grafana, Prometheus and Alertmanager (platform-gateway).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-uis
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - {port: 3000, protocol: TCP}
        - {port: 9090, protocol: TCP}
        - {port: 9093, protocol: TCP}
---
# Argo Rollouts runs the canary analysis queries against Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rollouts-to-prometheus
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argo-rollouts
      ports:
        - {port: 9090, protocol: TCP}
---
# The patch promoter reads the soak gates from Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-promoter-to-prometheus
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: promoter
      ports:
        - {port: 9090, protocol: TCP}
