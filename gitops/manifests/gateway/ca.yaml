# Demo certificate authority, created by cert-manager inside the cluster:
# a self-signed issuer signs one CA certificate, and the "ogp-demo-ca"
# ClusterIssuer signs everything else with it. The CA's private key never
# leaves the cluster and is new on every cluster. `./platform urls` exports
# the CA certificate and shows how to trust it.
# DEMO ONLY. Production uses a public CA (Let's Encrypt via ACME) or the
# company's internal PKI; see the README's "Local vs a real cloud".
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ogp-demo-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: orders-gateway-platform demo CA
  subject:
    organizations: [orders-gateway-platform (demo only)]
  secretName: ogp-demo-ca
  duration: 8760h # 1 year
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: selfsigned-bootstrap
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ogp-demo-ca
spec:
  ca:
    # A ClusterIssuer reads this Secret from cert-manager's own namespace.
    secretName: ogp-demo-ca
