# HTTPS routes for the platform UIs. The app's own routes (orders.*) come
# with its Helm chart. Prometheus and Alertmanager have no login: the
# Gateway is bound to 127.0.0.1 only (cluster/kind.yaml), and production
# would put SSO in front (README, production differences).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: platform
      namespace: envoy-gateway-system
      sectionName: https
  hostnames: [argocd.localtest.me]
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
---
