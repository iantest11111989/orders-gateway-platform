# One shared Gateway for every hostname. TLS terminates here; backends get
# plain HTTP inside the cluster. HTTPRoutes in any namespace may attach to
# the https listener; the http listener only redirects (redirect.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: platform
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      # A Gateway API wildcard matches one or more labels, so this covers
      # orders.dev.localtest.me too.
      hostname: "*.localtest.me"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: localtest-me-tls
      allowedRoutes:
        namespaces:
          from: All
