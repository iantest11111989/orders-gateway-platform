# One certificate for every hostname the platform serves. localtest.me and
# all its subdomains resolve to 127.0.0.1 in public DNS, so no /etc/hosts
# edits are needed. A wildcard covers one DNS label only, so the
# per-environment names (orders.dev.localtest.me, ...) need their own.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: localtest-me
  namespace: envoy-gateway-system
spec:
  secretName: localtest-me-tls
  dnsNames:
    - localtest.me
    - "*.localtest.me"
    - "*.dev.localtest.me"
    - "*.staging.localtest.me"
  duration: 2160h    # 90 days, like Let's Encrypt
  renewBefore: 720h  # 30 days
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: ogp-demo-ca
