# How Envoy Gateway runs the Envoy proxy for the "envoy" GatewayClass.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: platform
  namespace: envoy-gateway-system
spec:
  logging:
    level:
      default: warn
  # Access logs as JSON on stdout, so Loki can parse them with `| json`.
  telemetry:
    accessLog:
      settings:
        - format:
            type: JSON
            json:
              time: "%START_TIME%"
              method: "%REQ(:METHOD)%"
              host: "%REQ(:AUTHORITY)%"
              # Path without the query string, which can carry tokens.
              path: "%REQ_WITHOUT_QUERY(X-ENVOY-ORIGINAL-PATH?:PATH)%"
              status: "%RESPONSE_CODE%"
              duration_ms: "%DURATION%"
              upstream: "%UPSTREAM_HOST%"
              route: "%ROUTE_NAME%"
              user_agent: "%REQ(USER-AGENT)%"
              request_id: "%REQ(X-REQUEST-ID)%"
          sinks:
            - type: File
              file:
                path: /dev/stdout
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
        container:
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
        pod:
          securityContext:
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
        # The shutdown-manager sidecar (drains connections on restarts) has no
        # resources setting of its own; every container gets a memory limit.
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  containers:
                    - name: shutdown-manager
                      resources:
                        requests: {cpu: 10m, memory: 32Mi}
                        limits: {memory: 64Mi}
      envoyService:
        # kind maps host 127.0.0.1:80/443 to these NodePorts on the control
        # plane node (cluster/kind.yaml).
        type: NodePort
        # Cluster, not the default Local: the proxy pod runs on a worker,
        # but traffic enters through the control plane node.
        externalTrafficPolicy: Cluster
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 80
                  nodePort: 30080
                - port: 443
                  nodePort: 30443
