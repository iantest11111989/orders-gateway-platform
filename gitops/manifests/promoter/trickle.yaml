# About two orders a second to each environment, through the gateway like a real
# client (scripts/promoter.py trickle), so the soak gates and prod's canary
# analysis have traffic to judge. Orders use customer_id "cust-trickle".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trickle
  namespace: promoter
  labels: {app.kubernetes.io/name: trickle, app.kubernetes.io/part-of: orders-gateway-platform}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: trickle}
  template:
    metadata:
      labels: {app.kubernetes.io/name: trickle, app: trickle}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: trickle
          image: docker.io/library/python:3.14-alpine@sha256:5862d971d1f0ae26b258cefa4e893556b1d3aba81bd2ff30888704ad378bab67
          command: [python, /app/promoter.py, trickle]
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: TRICKLE_INTERVAL, value: "0.5"} # about 2 orders a second per environment
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          # Alive while the loop keeps touching /tmp/alive.
          livenessProbe:
            exec: {command: [python, -c, "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/tmp/alive') > 60)"]}
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            exec: {command: [test, -f, /tmp/alive]}
            periodSeconds: 10
          volumeMounts:
            - {name: script, mountPath: /app, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: script
          configMap: {name: promoter-script}
        - name: tmp
          emptyDir: {sizeLimit: 1Mi}
