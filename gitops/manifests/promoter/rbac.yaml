# Read-only, and only what the gates read: the three orders Applications in
# Argo CD, and the pods in the environments it promotes from. The GitHub
# token (Secret promoter-github) is the only thing that can change anything.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promoter
  namespace: promoter
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: promoter-read-applications
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: [orders-dev, orders-staging, orders-prod]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: promoter-read-applications
  namespace: argocd
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: promoter-read-applications}
subjects:
  - {kind: ServiceAccount, name: promoter, namespace: promoter}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: promoter-read-pods
  namespace: orders-dev
rules:
  - {apiGroups: [""], resources: [pods], verbs: [list]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: promoter-read-pods
  namespace: orders-dev
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: promoter-read-pods}
subjects:
  - {kind: ServiceAccount, name: promoter, namespace: promoter}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: promoter-read-pods
  namespace: orders-staging
rules:
  - {apiGroups: [""], resources: [pods], verbs: [list]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: promoter-read-pods
  namespace: orders-staging
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: promoter-read-pods}
subjects:
  - {kind: ServiceAccount, name: promoter, namespace: promoter}
