# Generated by `scripts/promoter.py configmap`; don't edit. CI checks it's current.
apiVersion: v1
kind: ConfigMap
metadata:
  name: promoter-script
  namespace: promoter
data:
  promoter.py: |
    #!/usr/bin/env python3
    """The patch promoter (brief section 10, decision 0024).

    Runs inside the cluster, because GitHub's runners can't reach a cluster on a
    laptop. Two modes:

      promoter.py run        one pass, run by the CronJob in gitops/manifests/promoter:
                             for each open promotion PR (promote/staging, promote/prod)
                             that ships only patches, check the gates on the
                             environment before it, and merge the PR when they all
                             pass. Every pass writes the gate results to one comment
                             on the PR, which is the record.
      promoter.py trickle    a light, steady stream of requests to dev, staging and prod
                             through the gateway, so "the SLO held for an hour" means
                             something (and prod's canary has traffic to analyse).
      promoter.py configmap  print the ConfigMap that ships this file
                             (gitops/manifests/promoter/script.yaml; CI checks it).

    Gates for promoting <env> (staging: dev before it; prod: staging before it) to
    the image <tag> in the PR:
      - not paused: promotion/PAUSED doesn't exist on main
      - the PR is a patch (Promotion-Kind: patch, from scripts/promotion-kind.sh)
      - the PR's checks finished and passed
      - the environment before has run only <tag> for SOAK_MINUTES
      - it served at least MIN_REQUESTS requests (/work and /echo) in that time (an SLO with no traffic
        proves nothing)
      - its availability and latency SLOs held over the last hour
      - no alert fired for it in the soak, and none is firing for <env>
      - its pods are all Ready on <tag>, and Argo CD has both environments
        Synced and Healthy (the same things ./platform verify checks)

    Without a GitHub token (Secret promoter-github, key token) it's a dry run: it
    reads the public repo, logs the gate table and changes nothing. Standard
    library only, so it runs on a plain python image.
    """

    import http.client
    import json
    import os
    import re
    import socket
    import ssl
    import sys
    import time
    import urllib.error
    import urllib.parse
    import urllib.request

    REPO = os.environ.get("GITHUB_REPOSITORY", "iantest11111989/orders-gateway-platform")
    TOKEN = os.environ.get("GITHUB_TOKEN", "").strip()
    PROMETHEUS = os.environ.get("PROMETHEUS_URL", "http://kube-prometheus-stack-prometheus.monitoring:9090")
    SOAK_MINUTES = int(os.environ.get("SOAK_MINUTES", "60"))
    MIN_REQUESTS = int(os.environ.get("MIN_REQUESTS", "300"))
    SLO_ERROR_BUDGET = 0.005  # 99.5% (decision 0006)

    PREVIOUS = {"staging": "dev", "prod": "staging"}  # promotion order
    MARKER = "<!-- patch-promoter -->"
    GOOD_CONCLUSIONS = {"success", "skipped", "neutral"}

    SA_DIR = "/var/run/secrets/kubernetes.io/serviceaccount"


    def log(msg):
        print(time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), msg, flush=True)


    def request(method, url, headers=None, body=None, context=None):
        """(status, parsed JSON or None). HTTP errors are returned, not raised."""
        data = json.dumps(body).encode() if body is not None else None
        req = urllib.request.Request(url, data=data, method=method, headers=headers or {})
        if data is not None:
            req.add_header("Content-Type", "application/json")
        try:
            with urllib.request.urlopen(req, timeout=20, context=context) as r:
                raw = r.read()
                return r.status, json.loads(raw) if raw else None
        except urllib.error.HTTPError as e:
            raw = e.read()
            try:
                return e.code, json.loads(raw) if raw else None
            except ValueError:
                return e.code, None


    def github(method, path, body=None):
        headers = {"Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28",
                   "User-Agent": "orders-gateway-platform-promoter"}
        if TOKEN:
            headers["Authorization"] = "Bearer " + TOKEN
        return request(method, "https://api.github.com/repos/" + REPO + path, headers, body)


    def github_ok(method, path, body=None):
        status, data = github(method, path, body)
        if status >= 300:
            raise RuntimeError(f"GitHub {method} {path}: HTTP {status}: {(data or {}).get('message', '')}")
        return data


    def prometheus(query):
        """The query's result vector: a list of (labels, float value)."""
        url = PROMETHEUS + "/api/v1/query?" + urllib.parse.urlencode({"query": query})
        status, data = request("GET", url)
        if status != 200 or data.get("status") != "success":
            raise RuntimeError(f"Prometheus query failed (HTTP {status}): {query}")
        return [(r["metric"], float(r["value"][1])) for r in data["data"]["result"]]


    def kube(path):
        with open(SA_DIR + "/token") as f:
            token = f.read().strip()
        ctx = ssl.create_default_context(cafile=SA_DIR + "/ca.crt")
        status, data = request("GET", "https://kubernetes.default.svc" + path,
                               {"Authorization": "Bearer " + token}, context=ctx)
        if status != 200:
            raise RuntimeError(f"Kubernetes GET {path}: HTTP {status}")
        return data


    def trailer(message, name):
        m = re.search(rf"^{re.escape(name)}:\s*(.+?)\s*$", message, re.M)
        return m.group(1) if m else None


    def image_tag(message):
        """The tag from the promotion commit's subject, which app.yml's promote-prs
        writes as '<env>: orders-gateway sha-<12 hex>'."""
        m = re.match(r"(?:staging|prod): orders-gateway (sha-[0-9a-f]{12})\b", message)
        return m.group(1) if m else None


    def is_paused(gh_raw):
        """promotion/PAUSED on main. Fails closed: anything but a clear 404 or 200
        (a 5xx, a rate limit) raises, and the pass promotes nothing."""
        status, _ = gh_raw("GET", "/contents/promotion/PAUSED?ref=main")
        if status == 404:
            return False
        if status == 200:
            return True
        raise RuntimeError(f"can't tell whether promotion is paused (HTTP {status}); promoting nothing this pass")


    def pushed_by_ci(activity, sha):
        """The newest push to the promotion branch is the PR's head and came from
        app.yml's promote-prs job (actor github-actions[bot]). The bots share one
        GitHub account, so a commit's author and its trailers could be written by
        anyone; who pushed it can't be."""
        if not activity:
            return False, "no push to the branch found"
        last = activity[0]
        actor = (last.get("actor") or {}).get("login", "?")
        if last.get("after") != sha:
            return False, f"the newest push ({last.get('after', '?')[:12]}) isn't the PR's head ({sha[:12]})"
        return actor == "github-actions[bot]", f"pushed by {actor}"


    def checks_gate(check_runs):
        runs = check_runs.get("check_runs", [])
        if not runs:
            return False, "no checks have run yet"
        pending = [r["name"] for r in runs if r["status"] != "completed"]
        failed = [r["name"] for r in runs if r["status"] == "completed" and r["conclusion"] not in GOOD_CONCLUSIONS]
        if failed:
            return False, "failed: " + ", ".join(sorted(failed))
        if pending:
            return False, "still running: " + ", ".join(sorted(pending))
        return True, f"{len(runs)} passed"


    def value(result):
        return result[0][1] if result else None


    def soak_gates(prev, env, tag, prom=prometheus, kube_get=kube):
        """The gates read from the cluster: [(name, passed, detail)]."""
        ns, target = prev, env  # namespace = Argo CD Application = environment
        window = f"{SOAK_MINUTES}m"
        gates = []

        minutes = value(prom(
            f'count_over_time((count(app_info{{namespace="{ns}",version="{tag}"}})'
            f' unless count(app_info{{namespace="{ns}",version!="{tag}"}}))[{window}:1m])'))
        # Allow two missed scrapes; a different version at any point resets the count.
        ran = int(minutes or 0)
        gates.append((f"{prev} has run only {tag} for {SOAK_MINUTES} min", ran >= SOAK_MINUTES - 2,
                      f"{ran} of the last {SOAK_MINUTES} minutes"))

        # The SLIs' routes (decision 0027): an SLO held with no traffic proves nothing.
        served = value(prom(f'sum(increase(http_requests_total{{namespace="{ns}",route=~"/work|/echo"}}[{window}]))'))
        served = int(served or 0)
        gates.append((f"{prev} served at least {MIN_REQUESTS} requests", served >= MIN_REQUESTS, f"{served} in {SOAK_MINUTES} min"))

        for slo in ("availability", "latency"):
            ratio = value(prom(f'slo:orders_{slo}_errors:ratio_rate1h{{namespace="{ns}"}}'))
            held = ratio is not None and ratio == ratio and ratio <= SLO_ERROR_BUDGET  # ratio == ratio: not NaN
            shown = "no data" if ratio is None or ratio != ratio else f"{ratio:.4%} failing (budget {SLO_ERROR_BUDGET:.1%})"
            gates.append((f"{prev} {slo} SLO held over 1 h", held, shown))

        fired = prom(f'max by (alertname) (max_over_time(ALERTS{{alertstate="firing",namespace="{ns}"}}[{window}]))')
        firing = prom(f'max by (alertname) (ALERTS{{alertstate="firing",namespace="{target}"}})')
        names = sorted({m.get("alertname", "?") for m, _ in fired})
        names_now = sorted({m.get("alertname", "?") for m, _ in firing})
        gates.append((f"no alerts for {prev} in the soak, none firing for {env}", not names and not names_now,
                      "none" if not names and not names_now else
                      "; ".join(filter(None, [names and f"{prev}: " + ", ".join(names),
                                              names_now and f"{env}: " + ", ".join(names_now)]))))

        pods = [p for p in kube_get(f"/api/v1/namespaces/{ns}/pods?labelSelector=app.kubernetes.io%2Fname%3Dapp")["items"]
                if p["metadata"].get("deletionTimestamp") is None]
        ready = [p for p in pods if any(c["type"] == "Ready" and c["status"] == "True" for c in p["status"].get("conditions", []))]
        # The chart sets the version label from the image tag (pods run the image by digest).
        on_tag = [p for p in pods if p["metadata"].get("labels", {}).get("app.kubernetes.io/version") == tag]
        gates.append((f"{prev} pods Ready on {tag}", bool(pods) and len(ready) == len(pods) == len(on_tag),
                      f"{len(ready)}/{len(pods)} Ready, {len(on_tag)}/{len(pods)} on {tag}"))

        states = []
        for app in (ns, target):
            st = kube_get(f"/apis/argoproj.io/v1alpha1/namespaces/argocd/applications/{app}").get("status", {})
            states.append((app, st.get("sync", {}).get("status"), st.get("health", {}).get("status")))
        gates.append(("Argo CD Synced and Healthy", all(s == "Synced" and h == "Healthy" for _, s, h in states),
                      ", ".join(f"{a} {s}/{h}" for a, s, h in states)))
        return gates


    def table(gates):
        rows = ["| Gate | | Result |", "| --- | --- | --- |"]
        rows += [f"| {name} | {'✅' if ok else '❌'} | {detail} |" for name, ok, detail in gates]
        return "\n".join(rows)


    def comment_body(env, tag, gates, outcome):
        return (f"{MARKER}\n**Patch promoter** ({'live' if TOKEN else 'dry run'}): promote **{env}** to `{tag}`, "
                f"[decision 0024](https://github.com/{REPO}/blob/main/docs/decisions/0024-patch-promoter.md).\n\n"
                f"{table(gates)}\n\n**{outcome}** "
                f"(checked {time.strftime('%Y-%m-%d %H:%M UTC', time.gmtime())}; rechecked every 10 minutes).")


    def record(number, body):
        """Create or update this PR's one promoter comment."""
        comments = github_ok("GET", f"/issues/{number}/comments?per_page=100")
        mine = [c for c in comments if c["body"].startswith(MARKER)]
        if mine:
            github_ok("PATCH", f"/issues/comments/{mine[-1]['id']}", {"body": body})
        else:
            github_ok("POST", f"/issues/{number}/comments", {"body": body})


    def evaluate(env, pr, paused, gh=github_ok, prom=prometheus, kube_get=kube):
        """(tag, gates) for one promotion PR."""
        sha = pr["head"]["sha"]
        message = gh("GET", f"/commits/{sha}")["commit"]["message"]
        tag = image_tag(message) or "?"
        kind = trailer(message, "Promotion-Kind") or "missing"
        activity = gh("GET", f"/activity?ref=refs/heads/{pr['head']['ref']}&per_page=1")
        gates = [("automatic promotion not paused", not paused, "promotion/PAUSED is on main" if paused else "not paused"),
                 ("the PR's commit was pushed by CI", *pushed_by_ci(activity, sha)),
                 ("ships only patches", kind == "patch",
                  f"Promotion-Kind: {kind}" + ("" if kind == "patch" else "; needs the owner's approval"))]
        gates.append(("PR checks passed", *checks_gate(gh("GET", f"/commits/{sha}/check-runs?per_page=100"))))
        if tag == "?":
            gates.append(("image tag in the commit subject", False, message.splitlines()[0] if message else "empty"))
            return tag, gates
        # Cluster gates only when the cheap ones pass: fewer queries, clearer table.
        if all(ok for _, ok, _ in gates):
            gates += soak_gates(PREVIOUS[env], env, tag, prom, kube_get)
        return tag, gates


    def run():
        owner = REPO.split("/")[0]
        paused = is_paused(github)
        log(f"repo {REPO}, {'live' if TOKEN else 'dry run (no token)'}, soak {SOAK_MINUTES} min"
            + (", PAUSED" if paused else ""))
        for env in ("staging", "prod"):
            prs = github_ok("GET", f"/pulls?state=open&base=main&head={owner}:promote/{env}")
            if not prs:
                log(f"{env}: no open promotion PR")
                continue
            pr = prs[0]
            tag, gates = evaluate(env, pr, paused)
            passed = all(ok for _, ok, _ in gates)
            for name, ok, detail in gates:
                log(f"{env} #{pr['number']} {'PASS' if ok else 'WAIT'} {name}: {detail}")
            if not passed:
                outcome = "Waiting: not every gate passes yet."
            elif not TOKEN:
                outcome = "All gates pass. Dry run, so not merged."
            else:
                outcome = "All gates pass: merged by the patch promoter."
            if TOKEN:
                record(pr["number"], comment_body(env, tag, gates, outcome))
            if passed and TOKEN:
                github_ok("PUT", f"/pulls/{pr['number']}/merge", {
                    "merge_method": "merge", "sha": pr["head"]["sha"],  # refuses if the branch moved since the check
                    "commit_title": f"Auto-promote {env} to {tag} (#{pr['number']})",
                    "commit_message": f"Patch promoter, decision 0024. Gates:\n\n{table(gates)}\n"})
                log(f"{env}: merged #{pr['number']} ({tag})")
                return  # one promotion per pass; the next pass sees the new state
            log(f"{env}: {outcome}")


    def trickle():
        """Steady requests to every environment, through the gateway like real clients:
        each round a small GET /work and a POST /echo, so both SLIs have data."""
        gateway = os.environ.get("GATEWAY", "envoy-platform.envoy-gateway-system")
        hosts = os.environ.get("TRICKLE_HOSTS", "orders.dev.localtest.me orders.staging.localtest.me orders.localtest.me").split()
        interval = float(os.environ.get("TRICKLE_INTERVAL", "1"))
        ctx = ssl.create_default_context()
        ctx.check_hostname, ctx.verify_mode = False, ssl.CERT_NONE  # the platform's own local CA
        body = json.dumps({"from": "trickle"})
        calls = [("GET", "/work?ms=10", None), ("POST", "/echo", body)]
        counts, conns = {}, {}
        # A line at once, then a summary every 5 minutes (not a line per request).
        # The first line also gives Loki this namespace right away (./platform verify checks it).
        log(f"trickle: one round to {', '.join(hosts)} every {interval:g} s, via {gateway}")
        last = time.time()

        def connect(host):  # TLS to the gateway Service, with the environment's hostname as SNI
            conn = http.client.HTTPSConnection(host, 443, timeout=5, context=ctx)
            conn.sock = ctx.wrap_socket(socket.create_connection((gateway, 443), timeout=5), server_hostname=host)
            return conn

        while True:
            for host, (method, path, payload) in ((h, c) for h in hosts for c in calls):
                code = "error"
                try:
                    conn = conns.get(host) or connect(host)
                    conn.request(method, path, payload, {"Content-Type": "application/json"} if payload else {})
                    resp = conn.getresponse()
                    resp.read()
                    code = resp.status
                    conns[host] = conn  # keep-alive: Envoy still balances (and splits a canary) per request
                except (OSError, http.client.HTTPException):
                    conns.pop(host, None)
                counts[(host, code)] = counts.get((host, code), 0) + 1
            if time.time() - last >= 300:
                log("trickle: " + ", ".join(f"{h} {c}: {n}" for (h, c), n in sorted(counts.items(), key=str)))
                counts, last = {}, time.time()
            with open("/tmp/alive", "w") as f:  # liveness probe
                f.write(str(time.time()))
            time.sleep(interval)


    def configmap():
        with open(__file__) as f:
            source = f.read()
        print("# Generated by `scripts/promoter.py configmap`; don't edit. CI checks it's current.")
        print("apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: promoter-script\n  namespace: promoter\ndata:\n  promoter.py: |")
        for line in source.splitlines():
            print(("    " + line).rstrip())


    if __name__ == "__main__":
        mode = sys.argv[1] if len(sys.argv) > 1 else ""
        {"run": run, "trickle": trickle, "configmap": configmap}.get(mode, lambda: sys.exit(__doc__))()
