# One promoter pass every 10 minutes (scripts/promoter.py run). Dry run until
# the owner creates Secret promoter-github (docs/decisions/0024).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: promoter
  namespace: promoter
  labels: {app.kubernetes.io/name: promoter, app.kubernetes.io/part-of: orders-gateway-platform}
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0 # the next pass is 10 minutes away
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels: {app.kubernetes.io/name: promoter, app: promoter}
        spec:
          serviceAccountName: promoter
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: promoter
              image: docker.io/library/python:3.14-alpine@sha256:5862d971d1f0ae26b258cefa4e893556b1d3aba81bd2ff30888704ad378bab67
              command: [python, /app/promoter.py, run]
              env:
                - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
                - {name: GITHUB_REPOSITORY, value: iantest11111989/orders-gateway-platform}
                - {name: SOAK_MINUTES, value: "60"}
                - {name: MIN_ORDERS, value: "300"}
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef: {name: promoter-github, key: token, optional: true}
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 96Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: script, mountPath: /app, readOnly: true}
          volumes:
            - name: script
              configMap: {name: promoter-script}
