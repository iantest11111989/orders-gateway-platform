          "type": "timeseries",
          "title": "Availability burn rate (1 h)",
          "description": "How fast each environment spends its availability error budget: 1 is exactly on budget, 14.4 is the fast-burn page threshold (decision 0006). Details on the orders-gateway dashboard.",
          "id": 11,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
