            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Availability budget left (last 24 h)",
          "description": "Share of the availability error budget still unspent over the last 24 hours, the window Prometheus keeps here. The SLO allows 0.5% of /work and /echo requests to fail with a 5xx (4xx are the caller's mistake and don't count). 100% means none failed, 0% means exactly 0.5% failed, negative means the SLO is broken for this window. Production would compute this over 30 days (see the README, Local vs a real cloud).",
