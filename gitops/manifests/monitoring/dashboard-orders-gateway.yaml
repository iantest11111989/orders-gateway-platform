          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "1 - (sum(increase(http_requests_total{namespace=\"$namespace\", route=~\"/work|/echo\", status=~\"5..\"}[24h])) or vector(0)) / sum(increase(http_requests_total{namespace=\"$namespace\", route=~\"/work|/echo\", status!~\"4..\"}[24h])) / 0.005",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.25
                  },
                  {
                    "color": "green",
                    "value": 0.5
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          }
        },
        {
          "type": "stat",
          "title": "Latency budget left (last 24 h)",
          "description": "Share of the latency error budget still unspent over the last 24 hours. The SLO allows 0.5% of /echo and /version requests to take longer than 250 ms (counted from the histogram's le=\"0.25\" bucket, so it's exact, not estimated). /work is left out: its latency is whatever the caller asks for with ?ms=. Negative means the SLO is broken for this window.",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
