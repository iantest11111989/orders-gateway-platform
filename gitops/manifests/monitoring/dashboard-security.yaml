        {
          "type": "table",
          "title": "Certificates: days until expiry",
          "description": "Every cert-manager Certificate and the days left before it expires. cert-manager renews at two thirds of its lifetime (about 30 days left for the 90-day gateway certificate); under 14 days means renewal is failing (CertificateExpiringSoon).",
          "id": 20,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
