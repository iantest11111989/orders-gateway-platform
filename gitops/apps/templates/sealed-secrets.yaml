# Sealed Secrets controller (chart sealed-secrets) in kube-system, where
# kubeseal looks by default, plus its DEMO ONLY key from
# gitops/manifests/sealed-secrets/. ./platform up also loads
# that key before Argo CD starts, so the controller never makes its own.
# Wave 10 (controllers): the SealedSecret CRD must exist before the apps in
# wave 20 that ship SealedSecrets (Grafana's admin login).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: orders-gateway-platform
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  sources:
    - repoURL: https://bitnami.github.io/sealed-secrets
      chart: sealed-secrets
      targetRevision: 2.22.0 # controller v0.41.2, same as kubeseal in the toolbox
      helm:
        releaseName: sealed-secrets
        valueFiles:
          - $values/gitops/values/sealed-secrets.yaml
    - repoURL: {{ .Values.repo.url }}
      targetRevision: {{ .Values.repo.revision }}
      ref: values
    - repoURL: {{ .Values.repo.url }}
      targetRevision: {{ .Values.repo.revision }}
      path: gitops/manifests/sealed-secrets
      directory:
        include: "*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
