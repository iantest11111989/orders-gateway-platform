# Argo Rollouts: progressive delivery for prod (canary with traffic shifted
# through Gateway API HTTPRoute weights). Values: gitops/values/argo-rollouts.yaml.
# Wave 10 (controllers); its CRDs ship with the chart. Dashboard at
# https://rollouts.localtest.me (route in gitops/manifests/gateway/). See
# decision 0011.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: orders-gateway-platform
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-rollouts
      targetRevision: 2.43.12 # Argo Rollouts v1.10.2
      helm:
        releaseName: argo-rollouts
        valueFiles:
          - $values/gitops/values/argo-rollouts.yaml
    - repoURL: {{ .Values.repo.url }}
      targetRevision: {{ .Values.repo.revision }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Auto-sync does not retry a failed sync of the same revision on its own;
    # this covers transient failures such as a CRD not yet Established.
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
    syncOptions:
      - CreateNamespace=true
      # The Rollout CRD is too large for client-side apply.
      - ServerSideApply=true
