# Traefik: the ingress controller, and the only way in from the host. It
# serves every Ingress in the cluster on plain HTTP, one entrypoint per host
# port, through a NodePort Service that kind maps to 127.0.0.1 (cluster/kind.yaml).
# Values: gitops/values/traefik.yaml. Wave 10 (controllers), after the
# Prometheus Operator CRDs (-10) its ServiceMonitor needs. The chart brings
# its own CRDs (Middleware is the one used here).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: orders-gateway-platform
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  sources:
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 43.0.0
      helm:
        releaseName: traefik
        valueFiles:
          - $values/gitops/values/traefik.yaml
    - repoURL: {{ .Values.repo.url }}
      targetRevision: {{ .Values.repo.revision }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
