# The shared HTTPS entry point: demo CA and *.localtest.me certificate
# (cert-manager), the Envoy GatewayClass and Gateway, the HTTP -> HTTPS
# redirect, and HTTPRoutes for the platform UIs. Plain manifests in
# gitops/manifests/gateway/. Wave 25: after cert-manager and Envoy Gateway
# (10) and after observability (20), whose `monitoring` namespace the
# Grafana/Prometheus/Alertmanager routes live in. At wave 15 the first sync
# failed with 'namespaces "monitoring" not found' and only got through on
# retries that happened to outlast wave 20's start. Nothing before wave 40
# (the apps) needs the Gateway.
# See decision 0008.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-gateway
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: orders-gateway-platform
  annotations:
    argocd.argoproj.io/sync-wave: "25"
  # Pruning or deleting this Application also deletes what it created
  # (decision 0031); without it, a rename orphaned the old resources (#77).
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: {{ .Values.repo.url }}
    targetRevision: {{ .Values.repo.revision }}
    path: gitops/manifests/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Auto-sync does not retry a failed sync of the same revision on its own;
    # this covers transient failures such as a CRD not yet Established.
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
    syncOptions:
      # A route may still apply before its backend Service is ready; that's
      # fine, it resolves once the Service appears.
      - SkipDryRunOnMissingResource=true
