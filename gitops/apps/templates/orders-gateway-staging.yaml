{{- if or (not .Values.env) (eq .Values.env "staging") }}
{{- /* One cluster per environment (the AWS design) sets env; locally it's
     unset, so all three environments render. */}}
# The app in namespace staging: charts/orders-gateway with
# environments/staging/values.yaml. Wave 40 (apps), after the gateway and
# monitoring. Promotion changes environments/staging/values.yaml only.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orders-gateway-staging
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: orders-gateway-platform
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  # Pruning or deleting this Application also deletes what it created.
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: {{ .Values.repo.url }}
    targetRevision: {{ .Values.repo.revision }}
    path: charts/orders-gateway
    helm:
      releaseName: app
      valueFiles:
        - ../../environments/staging/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Auto-sync does not retry a failed sync of the same revision on its own;
    # this covers transient failures such as a CRD not yet Established.
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
    syncOptions:
      - CreateNamespace=true
{{- end }}
