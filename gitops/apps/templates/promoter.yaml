# The patch promoter (gitops/manifests/promoter, decision 0024): merges
# patch-only promotion PRs once the environment before has soaked for an hour
# with its SLO met, and keeps a light trickle of orders flowing so that soak
# means something. Wave 45: after the orders-* environments (40), whose
# namespaces its Roles live in.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: promoter
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: orders-gateway-platform
  annotations:
    argocd.argoproj.io/sync-wave: "45"
spec:
  project: default
  source:
    repoURL: {{ .Values.repo.url }}
    targetRevision: {{ .Values.repo.revision }}
    path: gitops/manifests/promoter
  destination:
    server: https://kubernetes.default.svc
    namespace: promoter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
    syncOptions:
      - CreateNamespace=true
