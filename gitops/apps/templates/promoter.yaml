# The patch promoter (gitops/manifests/promoter): merges
# patch-only promotion PRs once the environment before has soaked for an hour
# with its SLO met, and keeps a light trickle of requests flowing so that soak
# means something (and the dashboards show traffic). The promoter itself runs
# only when Argo syncs from GitHub. Wave 45: after the environments dev, staging and prod (40), whose
# namespaces its Roles live in.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: promoter
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: orders-gateway-platform
  annotations:
    argocd.argoproj.io/sync-wave: "45"
  # Pruning or deleting this Application also deletes what it created;
  # without it, a rename orphaned the old resources.
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: {{ .Values.repo.url }}
    targetRevision: {{ .Values.repo.revision }}
    path: gitops/manifests/promoter
    {{- if not (contains "github.com" .Values.repo.url) }}
    # In-stack mode (Argo syncs from the stack's own git server, not
    # GitHub): there are no GitHub PRs to promote, so no CronJob, and no
    # anonymous GitHub API calls every 10 minutes. The trickle stays: the
    # dashboards and SLOs show live traffic without anyone sending any.
    directory:
      exclude: cronjob.yaml
    {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: promoter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
    syncOptions:
      - CreateNamespace=true
