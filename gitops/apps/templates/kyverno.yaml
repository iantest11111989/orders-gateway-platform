# Kyverno: admission policies (policies/, applied by kyverno-policies).
# Admission controller only; the background, cleanup and reports controllers
# are off to save memory (decision 0012). Values: gitops/values/kyverno.yaml.
# Wave 10 (controllers).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: orders-gateway-platform
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  sources:
    - repoURL: https://kyverno.github.io/kyverno/
      chart: kyverno
      targetRevision: 3.10.0 # Kyverno v1.20.0
      helm:
        releaseName: kyverno
        valueFiles:
          - $values/gitops/values/kyverno.yaml
    - repoURL: {{ .Values.repo.url }}
      targetRevision: {{ .Values.repo.revision }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Auto-sync does not retry a failed sync of the same revision on its own;
    # this covers transient failures such as a CRD not yet Established.
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
    syncOptions:
      - CreateNamespace=true
      # Kyverno's CRDs are too large for client-side apply's last-applied annotation.
      - ServerSideApply=true
