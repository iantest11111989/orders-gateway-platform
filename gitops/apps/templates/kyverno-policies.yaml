# Kyverno ClusterPolicies from policies/. `kyverno test` cases live next to
# them in policies/tests/ and aren't Kubernetes objects. Wave 30: after the
# observability stack, before the apps (40), so new app pods are checked.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: orders-gateway-platform
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: default
  source:
    repoURL: {{ .Values.repo.url }}
    targetRevision: {{ .Values.repo.revision }}
    path: policies
    directory:
      exclude: "{tests/*,README.md}"
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Auto-sync does not retry a failed sync of the same revision on its own;
    # this covers transient failures such as a CRD not yet Established.
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
