# The app in namespace prod: charts/orders-gateway with
# environments/prod/values.yaml. Wave 40 (apps), after the gateway and
# monitoring. Promotion changes environments/prod/values.yaml only.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: orders-gateway-platform
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  # Pruning or deleting this Application also deletes what it created;
  # without it, a rename orphaned the old resources.
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: {{ .Values.repo.url }}
    targetRevision: {{ .Values.repo.revision }}
    path: charts/orders-gateway
    helm:
      releaseName: app
      valueFiles:
        - ../../environments/prod/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  # Prod runs a plain Deployment, but the canary demos copy this Application
  # (scripts/demo.sh) and turn the Rollout on: Argo Rollouts then moves canary
  # traffic by changing the HTTPRoute's backend weights, and the diff ignores
  # them so self-heal doesn't undo a canary step.
  # Deliberately without RespectIgnoreDifferences and without
  # managedFieldsManagers (the removed scripts/check-route-upgrade.sh failed for
  # both): spec.rules is an atomic list, so the plugin owns all of it after
  # any canary, and either setting then keeps Git's route changes off the
  # cluster (#14 on ogp). The cost: a sync mid-canary applies Git's weights
  # (all traffic to stable) until Rollouts reconciles, which takes at most a
  # minute (--rollout-resync=60, gitops/values/argo-rollouts.yaml).
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jqPathExpressions:
        # `[]?`: the /admin rule has no backendRefs, and a plain `[]` errors on
        # it, which drops the whole expression: Argo CD then sees the canary's
        # weights as drift and resets them every sync, the canary only gets
        # traffic part of the time, and its analysis comes back Inconclusive.
        - .spec.rules[].backendRefs[]?.weight
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Auto-sync does not retry a failed sync of the same revision on its own;
    # this covers transient failures such as a CRD not yet Established.
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
    syncOptions:
      - CreateNamespace=true
