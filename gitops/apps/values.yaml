# Git source every child Application reads its values and manifests from.
# ./platform up overrides these (from REPO_URL / REVISION) in the root
# Application, so forks and branches work without editing files.
repo:
  url: https://github.com/iantest11111989/orders-gateway-platform.git
  revision: main

# Which environment this cluster runs. Empty (local): dev, staging and prod
# all run here. With one cluster per environment, each sets its own.
env: ""
