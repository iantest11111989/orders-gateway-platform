# Envoy Gateway Helm values (chart oci://docker.io/envoyproxy/gateway-helm).
# Application: gitops/apps/templates/envoy-gateway.yaml. The Envoy proxy
# pods it creates are configured separately, in
# gitops/manifests/gateway/envoyproxy.yaml.

# CRDs come from the gateway-crds Application (wave -10).
crds:
  enabled: false

deployment:
  envoyGateway:
    resources:
      requests: {cpu: 25m, memory: 96Mi}
      limits: {memory: 256Mi}

config:
  envoyGateway:
    logging:
      level:
        default: info

# Spreads Envoy proxy pods across zones via a mutating webhook. With one
# proxy replica it does nothing, so skip the extra webhook.
topologyInjector:
  enabled: false
