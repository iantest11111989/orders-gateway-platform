# metrics-server Helm values (chart kubernetes-sigs/metrics-server).
# Application: gitops/apps/templates/metrics-server.yaml.

# kind's kubelets serve self-signed certificates that don't name the node's
# IP, so metrics-server can't verify them. DEMO ONLY: production clusters
# have kubelet serving certificates signed by the cluster CA.
args:
  - --kubelet-insecure-tls

resources:
  requests: {cpu: 20m, memory: 48Mi}
  limits: {memory: 128Mi}

# Its own health metrics, scraped by Prometheus.
serviceMonitor:
  enabled: true
metrics:
  enabled: true
