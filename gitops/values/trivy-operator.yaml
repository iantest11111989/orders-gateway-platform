# Trivy Operator chart values (gitops/apps/templates/trivy-operator.yaml).
# Decision 0021. Sized for the 6 CPU / 12 GiB budget: the vulnerability DB
# lives once in the built-in Trivy server, and only one scan Job runs at a time.

operator:
  scanJobsConcurrentLimit: 1
  scanJobTimeout: 10m
  # Running images and workload configuration. The rest is
  # off to save CPU and memory: RBAC and node (infra) assessments, the
  # compliance reports, secrets baked into images, and SBOM reports (the app's
  # SBOM is in its image index).
  vulnerabilityScannerEnabled: true
  configAuditScannerEnabled: true
  rbacAssessmentScannerEnabled: false
  infraAssessmentScannerEnabled: false
  clusterComplianceEnabled: false
  exposedSecretScannerEnabled: false
  sbomGenerationEnabled: false
  # One shared Trivy server holds the DB (ClientServer mode), so scan Jobs
  # don't each download and load it.
  builtInTrivyServer: true

# Images from Docker Hub (an approved registry, policies/restrict-image-registries.yaml),
# not the chart's default mirror.gcr.io.
image:
  registry: docker.io
  repository: aquasec/trivy-operator

# Measured on ogp while scanning: about 220Mi (it caches every report).
resources:
  requests: {cpu: 25m, memory: 192Mi}
  limits: {memory: 384Mi}

# Pod Security "restricted" (enforced on trivy-system, see the Application):
# non-root, RuntimeDefault seccomp, no privilege escalation, all capabilities
# dropped, read-only root filesystem, for the operator, the server and the
# scan Jobs.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  seccompProfile: {type: RuntimeDefault}

trivyOperator:
  scanJobPodTemplatePodSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile: {type: RuntimeDefault}

serviceMonitor:
  enabled: true

trivy:
  image:
    registry: docker.io
    repository: aquasec/trivy
  # Same gate as CI: report everything, but the dashboards and
  # alerts care about fixable HIGH/CRITICAL.
  severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
  # Scan Jobs are clients of the server: no DB in memory. No CPU limit: Helm
  # merges our map into the chart's default (limits.cpu 500m), so leaving cpu
  # out kept the limit, and the first round of scans after an install was
  # throttled hard enough to raise CPUThrottlingHigh (and InfoInhibitor) on a
  # quiet system. `cpu: null` removes the default; scans are short Jobs.
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: null, memory: 512Mi}
  # The server keeps the DB on an emptyDir: it downloads again after a restart
  # (about a minute) but needs no PersistentVolume.
  storageClassEnabled: false
  server:
    resources:
      requests: {cpu: 50m, memory: 384Mi}
      limits: {memory: 768Mi}
    podSecurityContext:
      runAsUser: 65534
      runAsNonRoot: true
      fsGroup: 65534
      seccompProfile: {type: RuntimeDefault}
    securityContext:
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: {drop: [ALL]}
