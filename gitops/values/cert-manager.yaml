# cert-manager Helm values (chart jetstack/cert-manager). Application:
# gitops/apps/templates/cert-manager.yaml. Trimmed for the 6 CPU / 12 GB
# budget: one replica of each component.

crds:
  enabled: true
  # Keep the CRDs (and so every Certificate) if the release is ever removed.
  keep: true

# JSON logs, so Loki can parse them with `| json` like every other component.
global:
  logLevel: 2
extraArgs:
  - --logging-format=json

resources:
  requests: {cpu: 10m, memory: 48Mi}
  limits: {memory: 128Mi}

webhook:
  extraArgs:
    - --logging-format=json
  resources:
    requests: {cpu: 10m, memory: 24Mi}
    limits: {memory: 64Mi}

cainjector:
  extraArgs:
    - --logging-format=json
  resources:
    requests: {cpu: 10m, memory: 48Mi}
    limits: {memory: 128Mi}

# The post-install check Job is a Helm hook; Argo CD's health checks cover it.
startupapicheck:
  enabled: false

# Scraped by Prometheus (CRDs from prometheus-operator-crds, wave -10).
prometheus:
  enabled: true
  servicemonitor:
    enabled: true
