# Argo Rollouts Helm values (chart argo/argo-rollouts).
# Application: gitops/apps/templates/argo-rollouts.yaml.

controller:
  # One replica for the 6 CPU / 12 GB budget (default 2, with leader election).
  replicas: 1
  # Reconcile every Rollout each minute (default 15 min). If an Argo CD sync
  # resets the HTTPRoute weights mid-canary (orders-prod ignores them only in
  # the diff), a paused canary gets its weights back within a minute instead
  # of running at 100/0 while it reports 10%. Checked on ogp: a reconcile of
  # a paused Rollout sets the weights again at once.
  extraArgs:
    - --rollout-resync=60
  # The Gateway API plugin runs as a second Go process in this container, so
  # both count against the limit. At 256Mi the nightly's arm64 run (fresh
  # cluster: cache warm-up plus a canary) was OOMKilled; on ogp the peak is
  # ~190Mi, steady ~70Mi.
  resources:
    requests: {cpu: 25m, memory: 128Mi}
    limits: {memory: 512Mi}
  # Go's GC works harder near this soft limit. It is per process, and the
  # plugin inherits it, so each of the two gets 240MiB: together they stay
  # under the 512Mi container limit (controller peak ~190Mi, plugin small).
  extraEnv:
    - name: GOMEMLIMIT
      value: 240MiB
  logging:
    format: json

  # The Gateway API traffic router plugin moves canary traffic by changing
  # HTTPRoute backend weights. The controller loads plugins from a URL; the
  # plugin ships one binary per CPU architecture, so an init container picks
  # the right one (arm64 on Apple silicon, amd64 in CI), checks its sha256 and
  # hands it over in a shared volume. Version: v0.17.0 (2026-09-01).
  trafficRouterPlugins:
    - name: argoproj-labs/gatewayAPI
      location: file:///plugins/gatewayapi-plugin
  initContainers:
    - name: fetch-gatewayapi-plugin
      # docker.io/library/alpine (multi-arch index digest): sh, wget with TLS, sha256sum.
      # Renovate keeps it current (the gitops/values regex manager in renovate.json5).
      image: docker.io/library/alpine:3.22.8@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
      command: [sh, -euc]
      args:
        - |
          v=v0.17.0
          case "$(uname -m)" in
            x86_64)  arch=amd64; sum=1904ca787d33107c140521899d61fff030ee75d99908bd175fca5a4647759061 ;;
            aarch64) arch=arm64; sum=5221279f7bf2c9b2c0ff6ed7ff12718ecce1d4892f1ff5e5224bb723cfd0fd92 ;;
            *) echo "unsupported architecture $(uname -m)"; exit 1 ;;
          esac
          wget -q -O /plugins/gatewayapi-plugin \
            "https://github.com/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/releases/download/$v/gatewayapi-plugin-linux-$arch"
          echo "$sum  /plugins/gatewayapi-plugin" | sha256sum -c -
          chmod 0755 /plugins/gatewayapi-plugin
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
        seccompProfile: {type: RuntimeDefault}
      # The plugin binary is 74 MiB (amd64; arm64 70 MiB). While wget writes
      # it, its dirty page cache is charged to this container, and sha256sum
      # reads it back, so a 64Mi limit was OOM-killed whenever writeback was
      # slower than the download (seen in CI on GitHub runners; the retry
      # succeeds, so only `./platform budget` noticed). The limit only applies
      # while this runs; the request, which the budget counts, is unchanged.
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 160Mi}
      volumeMounts:
        - name: gatewayapi-plugin
          mountPath: /plugins
  volumes:
    - name: gatewayapi-plugin
      emptyDir: {}
  volumeMounts:
    - name: gatewayapi-plugin
      mountPath: /plugins
      readOnly: true

  # Scraped by Prometheus (rollout phase, analysis runs).
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# RBAC only for the traffic provider we use.
providerRBAC:
  enabled: true
  providers:
    istio: false
    smi: false
    ambassador: false
    awsLoadBalancerController: false
    awsAppMesh: false
    traefik: false
    apisix: false
    contour: false
    glooPlatform: false
    gatewayAPI: true

dashboard:
  enabled: true
  # Read-only: the dashboard has no login, so it must not promote or abort.
  # Use `kubectl argo rollouts` in ./platform shell for that.
  readonly: true
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
