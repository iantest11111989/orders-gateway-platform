# kube-prometheus-stack values (chart prometheus-community/kube-prometheus-stack).
# Sized for the 6 CPU / 12 GB budget.
# Every pod except node-exporter runs restricted: non-root, read-only root
# filesystem, no capabilities, RuntimeDefault seccomp.

# CRDs come from the prometheus-operator-crds Application (wave -10).
crds:
  enabled: false

# Rules from the chart: keep the Kubernetes, node and Prometheus ones. Our
# own SLO and platform alerts live in alerts/.
defaultRules:
  create: true
  rules:
    # kind has no Windows nodes
    windows: false
  # Link every chart alert to the upstream runbooks
  runbookUrl: https://runbooks.prometheus-operator.dev/runbooks

# ---- Alertmanager ----
alertmanager:
  alertmanagerSpec:
    replicas: 1
    retention: 48h
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 64Mi}
    securityContext: &restrictedPod
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
      seccompProfile: {type: RuntimeDefault}
  # Routing: every notification goes to alert-receiver
  # (gitops/manifests/monitoring/alert-receiver.yaml), which writes it as one
  # JSON log line, so alerts show up in Loki and Grafana. The path says how it
  # was routed: /page, /ticket, /log, or /watchdog for the heartbeat.
  # Production would send /page to an on-call tool and /ticket to chat.
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: log
      group_by: [namespace, alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # Always firing: a notification every 5 minutes proves the whole path
        # (Prometheus -> Alertmanager -> receiver -> Loki) works.
        - matchers: ['alertname = "Watchdog"']
          receiver: watchdog
          group_wait: 0s
          group_interval: 5m
          repeat_interval: 5m
        - matchers: ['alertname = "InfoInhibitor"']
          receiver: "null"
        # Ours use page/ticket; the chart's rules use critical/warning/info.
        - matchers: ['severity =~ "page|critical"']
          receiver: page
          group_wait: 10s
          repeat_interval: 1h
        - matchers: ['severity =~ "ticket|warning"']
          receiver: ticket
    # The chart's defaults, plus the same for page over ticket.
    inhibit_rules:
      - source_matchers: ['severity =~ "critical|page"']
        target_matchers: ['severity =~ "warning|ticket|info"']
        equal: [namespace, alertname]
      - source_matchers: ['severity = "warning"']
        target_matchers: ['severity = "info"']
        equal: [namespace, alertname]
      - source_matchers: ['alertname = "InfoInhibitor"']
        target_matchers: ['severity = "info"']
        equal: [namespace]
      - target_matchers: ['alertname = "InfoInhibitor"']
    receivers:
      - name: "null"
      - name: page
        webhook_configs: [{url: "http://alert-receiver.monitoring.svc:8080/page", send_resolved: true}]
      - name: ticket
        webhook_configs: [{url: "http://alert-receiver.monitoring.svc:8080/ticket", send_resolved: true}]
      - name: log
        webhook_configs: [{url: "http://alert-receiver.monitoring.svc:8080/log", send_resolved: true}]
      - name: watchdog
        webhook_configs: [{url: "http://alert-receiver.monitoring.svc:8080/watchdog", send_resolved: false}]
    templates:
      - /etc/alertmanager/config/*.tmpl

# ---- Grafana ----
grafana:
  # Login admin / admin12345 (the shared local login for every UI), from the SealedSecret
  # gitops/manifests/monitoring/grafana-admin.sealed.yaml. Read it with:
  #   ./platform kubectl -n monitoring get secret grafana-admin -o jsonpath='{.data.admin-password}' | base64 -d
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Helm test pods aren't used by Argo CD.
  testFramework:
    enabled: false
  # Grafana 13 runs each bundled backend plugin as its own process; 256Mi
  # got the pod OOM-killed on start in the ogp sync test.
  resources:
    requests: {cpu: 25m, memory: 256Mi}
    limits: {memory: 512Mi}
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    runAsGroup: 472
    fsGroup: 472
    seccompProfile: {type: RuntimeDefault}
  containerSecurityContext: &restrictedContainer
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: {drop: [ALL]}
  grafana.ini:
    server:
      # Grafana's local address: http://localhost:3000, at the root, plain HTTP.
      root_url: http://localhost:3000/
      serve_from_sub_path: false
    analytics:
      reporting_enabled: false
      check_for_updates: false
      check_for_plugin_updates: false
    # No background plugin downloads: we use only the bundled datasources.
    plugins:
      preinstall_disabled: true
    log:
      mode: console
    log.console:
      format: json
  sidecar:
    resources:
      requests: {cpu: 5m, memory: 64Mi}
      limits: {memory: 128Mi}
    securityContext: *restrictedContainer
    dashboards:
      enabled: true
      # Dashboards are ConfigMaps labelled grafana_dashboard=1, in any namespace.
      label: grafana_dashboard
      searchNamespace: ALL
    datasources:
      enabled: true
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.logging.svc:3100
      jsonData:
        maxLines: 1000

# ---- Prometheus Operator ----
prometheusOperator:
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 128Mi}
  # The validating webhook needs certificates from a hook Job; rules are
  # validated by promtool in CI instead.
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  securityContext: *restrictedPod
  containerSecurityContext: *restrictedContainer
  prometheusConfigReloader:
    resources:
      requests: {cpu: 5m, memory: 16Mi}
      limits: {memory: 32Mi}

# ---- Prometheus ----
prometheus:
  prometheusSpec:
    replicas: 1
    # 24 h: enough for the 6 h burn-rate alerts.
    # Production would keep 30+ days; see the README's "Local vs a real cloud".
    retention: 24h
    retentionSize: 4GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    resources:
      requests: {cpu: 200m, memory: 768Mi}
      limits: {memory: 1536Mi}
    securityContext: *restrictedPod
    # Pick up every ServiceMonitor, PodMonitor, Probe, ScrapeConfig and
    # PrometheusRule in the cluster, not only the ones labelled for this
    # Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard # kind's local-path provisioner
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi
    # Keep Prometheus away from Loki so a log burst can't starve it.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              namespaceSelector: {}
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: loki

# ---- Exporters ----
kube-state-metrics:
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 128Mi}

prometheus-node-exporter:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 64Mi}

# ---- Control-plane scraping (kind's kubeadm patches expose these, see
# cluster/kind.yaml) ----
kubeEtcd:
  service:
    port: 2381
    targetPort: 2381

# Drop high-cardinality series nothing here uses. Each saves thousands of
# series on this small cluster.
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      - sourceLabels: [__name__]
        regex: apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket|apiserver_request_sli_duration_seconds_bucket|apiserver_admission_.*_bucket
        action: drop
kubelet:
  serviceMonitor:
    cAdvisorMetricRelabelings:
      - sourceLabels: [__name__]
        regex: container_(tasks_state|memory_failures_total|blkio_device_usage_total|fs_.*|network_tcp_usage_total|network_udp_usage_total)
        action: drop
      # cAdvisor reports a series per pod sandbox ("pause") container too.
      - sourceLabels: [container]
        regex: POD
        action: drop
