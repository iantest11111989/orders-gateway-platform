# kube-prometheus-stack values (chart prometheus-community/kube-prometheus-stack).
# Sized for the 6 CPU / 12 GB budget; see decision 0007 for the numbers.
# Every pod except node-exporter runs restricted: non-root, read-only root
# filesystem, no capabilities, RuntimeDefault seccomp.

# CRDs come from the prometheus-operator-crds Application (wave -10).
crds:
  enabled: false

# Rules from the chart: keep the Kubernetes, node and Prometheus ones. Our
# own SLO and platform alerts live in alerts/.
defaultRules:
  create: true
  rules:
    # kind has no Windows nodes
    windows: false
  # Link every chart alert to the upstream runbooks
  runbookUrl: https://runbooks.prometheus-operator.dev/runbooks

# ---- Alertmanager ----
alertmanager:
  alertmanagerSpec:
    replicas: 1
    retention: 48h
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 64Mi}
    securityContext: &restrictedPod
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
      seccompProfile: {type: RuntimeDefault}
  # Routing to a visible local receiver comes in the alert-routing PR. Until
  # then alerts are visible in the Alertmanager UI (the Watchdog alert is
  # always firing, which proves the pipeline works).

# ---- Grafana ----
grafana:
  # DEMO ONLY: the chart's fixed default login (admin / prom-operator) until
  # the Sealed Secrets PR moves it into a sealed secret.
  adminPassword: prom-operator
  # Helm test pods aren't used by Argo CD.
  testFramework:
    enabled: false
  # Grafana 13 runs each bundled backend plugin as its own process; 256Mi
  # got the pod OOM-killed on start in the ogp sync test.
  resources:
    requests: {cpu: 25m, memory: 256Mi}
    limits: {memory: 512Mi}
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    runAsGroup: 472
    fsGroup: 472
    seccompProfile: {type: RuntimeDefault}
  containerSecurityContext: &restrictedContainer
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: {drop: [ALL]}
  grafana.ini:
    server:
      root_url: https://grafana.localtest.me
    analytics:
      reporting_enabled: false
      check_for_updates: false
      check_for_plugin_updates: false
    # No background plugin downloads: we use only the bundled datasources.
    plugins:
      preinstall_disabled: true
    log:
      mode: console
    log.console:
      format: json
  sidecar:
    resources:
      requests: {cpu: 5m, memory: 64Mi}
      limits: {memory: 128Mi}
    securityContext: *restrictedContainer
    dashboards:
      enabled: true
      # Dashboards are ConfigMaps labelled grafana_dashboard=1, in any namespace.
      label: grafana_dashboard
      searchNamespace: ALL
    datasources:
      enabled: true
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.logging.svc:3100
      jsonData:
        maxLines: 1000

# ---- Prometheus Operator ----
prometheusOperator:
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 128Mi}
  # The validating webhook needs certificates from a hook Job (or
  # cert-manager, which arrives in the gateway PR). Rules are validated by
  # promtool in CI instead. Revisit once cert-manager is in.
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  securityContext: *restrictedPod
  containerSecurityContext: *restrictedContainer
  prometheusConfigReloader:
    resources:
      requests: {cpu: 5m, memory: 16Mi}
      limits: {memory: 32Mi}

# ---- Prometheus ----
prometheus:
  prometheusSpec:
    replicas: 1
    retention: 2d
    retentionSize: 4GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    resources:
      requests: {cpu: 200m, memory: 768Mi}
      limits: {memory: 1536Mi}
    securityContext: *restrictedPod
    # Pick up every ServiceMonitor, PodMonitor, Probe, ScrapeConfig and
    # PrometheusRule in the cluster, not only the ones labelled for this
    # Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard # kind's local-path provisioner
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi
    # Keep Prometheus away from Loki so a log burst can't starve it.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              namespaceSelector: {}
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: loki

# ---- Exporters ----
kube-state-metrics:
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 128Mi}

prometheus-node-exporter:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 64Mi}

# ---- Control-plane scraping (kind's kubeadm patches expose these, see
# cluster/kind.yaml) ----
kubeEtcd:
  service:
    port: 2381
    targetPort: 2381

# Drop high-cardinality series nothing here uses (brief: "dropped unused
# series"). Each saves thousands of series on this small cluster.
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      - sourceLabels: [__name__]
        regex: apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket|apiserver_request_sli_duration_seconds_bucket|apiserver_admission_.*_bucket
        action: drop
kubelet:
  serviceMonitor:
    cAdvisorMetricRelabelings:
      - sourceLabels: [__name__]
        regex: container_(tasks_state|memory_failures_total|blkio_device_usage_total|fs_.*|network_tcp_usage_total|network_udp_usage_total)
        action: drop
      # cAdvisor reports a series per pod sandbox ("pause") container too.
      - sourceLabels: [container]
        regex: POD
        action: drop
