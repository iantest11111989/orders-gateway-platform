# Argo CD Helm values (chart argo/argo-cd). Used twice: by ./platform up for
# the first install, and by gitops/apps/argocd.yaml once Argo CD manages
# itself. Keep both in sync by editing only this file.

global:
  domain: argocd.localtest.me
  # Every Argo CD pod on the control plane is fine to spread; nothing special.

# Trimmed for the 6 CPU / 12 GB budget: no Dex (local admin only), no
# notifications controller, single replicas, no Redis HA.
dex:
  enabled: false
notifications:
  enabled: false
redis-ha:
  enabled: false

configs:
  params:
    # TLS is terminated at Envoy Gateway (gateway PR); Argo CD serves HTTP
    # inside the cluster.
    server.insecure: true
    # Reconcile every 3 minutes (default), with jitter, to save CPU.
    timeout.reconciliation: 180s
  cm:
    # Show resource health for Argo Rollouts and other CRDs out of the box.
    exec.enabled: false
    admin.enabled: true
    statusbadge.enabled: false
  rbac:
    policy.default: role:readonly

controller:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}
  metrics:
    enabled: true
    # ServiceMonitors are switched on in the observability PR, once the
    # Prometheus Operator CRDs exist.
    serviceMonitor:
      enabled: false

server:
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

repoServer:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

applicationSet:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

redis:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
  metrics:
    enabled: false
