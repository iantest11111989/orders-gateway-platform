# Argo CD Helm values (chart argo/argo-cd). Used twice: by ./platform up for
# the first install, and by gitops/apps/argocd.yaml once Argo CD manages
# itself. Keep both in sync by editing only this file.

global:
  domain: argocd.localtest.me
  # Every Argo CD pod on the control plane is fine to spread; nothing special.

# Trimmed for the 6 CPU / 12 GB budget: no Dex (local admin only), no
# notifications controller, single replicas, no Redis HA.
dex:
  enabled: false
notifications:
  enabled: false
redis-ha:
  enabled: false

configs:
  params:
    # TLS is terminated at Envoy Gateway (gateway PR); Argo CD serves HTTP
    # inside the cluster.
    server.insecure: true
    # JSON logs, so Loki can parse them with `| json` like every other component.
    controller.log.format: json
    server.log.format: json
    reposerver.log.format: json
    applicationsetcontroller.log.format: json
    commitserver.log.format: json
  cm:
    # Poll Git every 3 minutes (default 120s) to save CPU. The controller
    # reads this from argocd-cm, not argocd-cmd-params-cm.
    timeout.reconciliation: 180s
    # No web terminal into pods.
    exec.enabled: false
    admin.enabled: true
    statusbadge.enabled: false
    # Give Application resources a health status again (removed in Argo CD
    # 1.8), so sync waves in the app-of-apps wait for each child to be
    # Healthy before starting the next wave. From the Argo CD docs.
    # CRD health without the "not yet Established" wait. Argo CD records no
    # tracking annotation on CRDs, so when a CRD turns Established a moment
    # after apply, nothing tells its Application to re-check health: the app
    # sat at Progressing until the next 3-minute resync and held back the
    # sync waves behind it. Kubernetes establishes a CRD within seconds, so
    # this check reports Healthy unless the CRD is actually broken; the
    # failure cases are the same as Argo CD's built-in check
    # (resource_customizations/apiextensions.k8s.io/CustomResourceDefinition).
    resource.customizations.health.apiextensions.k8s.io_CustomResourceDefinition: |
      hs = {status = "Healthy", message = "CRD accepted"}
      if obj.metadata.deletionTimestamp ~= nil then
        hs.status = "Progressing"
        hs.message = "CRD is terminating"
        return hs
      end
      if obj.status == nil or obj.status.conditions == nil then
        return hs
      end
      for _, c in pairs(obj.status.conditions) do
        if c.type == "NamesAccepted" and c.status == "False" then
          hs.status = "Degraded"
          hs.message = "CRD names have not been accepted: " .. (c.message or "")
          return hs
        end
        if c.type == "NonStructuralSchema" and c.status == "True" then
          hs.status = "Degraded"
          hs.message = "Schema violations found: " .. (c.message or "")
          return hs
        end
        if c.type == "Established" and c.status == "False" and c.reason == "InvalidCABundle" then
          hs.status = "Degraded"
          hs.message = "CRD is not established: " .. (c.message or "")
          return hs
        end
      end
      return hs
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
  rbac:
    policy.default: role:readonly

controller:
  resources:
    # The first sync of every app fills the cluster cache at once: peak use is
    # well above the ~275Mi steady state. With 512Mi it was OOMKilled on ogp,
    # and on CI it restarted 4 times in 10 min, losing sync progress each time.
    # At 1Gi it was still OOMKilled once during a fresh CI bootstrap
    # (`./platform budget`, PR #29), after Kyverno, NetworkPolicies and Sealed
    # Secrets added more resources to watch; on ogp its peak was 856Mi.
    requests: {cpu: 100m, memory: 384Mi}
    limits: {memory: 1536Mi}
  # Go's GC works harder as the heap nears this soft limit (~80% of the hard
  # limit), so a bootstrap spike slows the controller down instead of getting
  # it OOMKilled (losing its sync progress).
  env:
    - name: GOMEMLIMIT
      value: 1200MiB
  metrics:
    enabled: true
    # Scraped by Prometheus (CRDs from prometheus-operator-crds, wave -10).
    serviceMonitor:
      enabled: true

server:
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

repoServer:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

applicationSet:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

redis:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
  metrics:
    enabled: false
