# What every environment shares, layered over the chart defaults; the env
# files hold only what differs (image, replicas, entrypoint).

image:
  # The in-stack registry ./pipeline publishes to.
  repository: localhost:30500/orders-gateway

ingress:
  className: traefik
  # orders-gateway.localhost:<port>, and plain localhost:<port>.
  hosts: [orders-gateway.localhost]
  default: true

# dev (one pod) turns these off.
podDisruptionBudget:
  enabled: true
topologySpread:
  enabled: true
