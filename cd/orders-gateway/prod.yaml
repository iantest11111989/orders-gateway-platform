# prod: promoted from staging with ./pipeline cd.
env: prod

# false: changes wait for a Sync click (or ./pipeline cd --sync).
autoSync: false

# Set by ./pipeline cd: image and chart <version> from the in-stack registry.
version: 0.1.0

image:
  tag: 0.1.0
  digest: ""

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

ingress:
  entrypoint: prod
