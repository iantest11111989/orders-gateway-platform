# dev: what ./pipeline cd orders-gateway dev deploys (a published version or a
# dev-only build). Overrides values.yaml next to it.
env: dev

# true: Argo CD applies every change to this file by itself (prune and
# self-heal). false: a change waits until someone clicks Sync in Argo CD
# (or ./pipeline cd --sync).
autoSync: true

# The published version this environment runs: image
# localhost:30500/orders-gateway:<version> and chart orders-gateway <version>
# from the in-stack registry. Set by ./pipeline cd; without a version (a
# dev-only build) the chart is helm/orders-gateway as it is in Git.
version: 0.1.0

image:
  tag: 0.1.0
  digest: ""

replicas: 1

ingress:
  entrypoint: dev


# One pod: nothing to keep up through a drain or to spread.
podDisruptionBudget:
  enabled: false
topologySpread:
  enabled: false
