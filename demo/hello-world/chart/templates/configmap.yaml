apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hello-world.name" . }}
  labels:
    {{- include "hello-world.labels" . | nindent 4 }}
data:
  {{- /* Only the settings that are set (not null). Not `with`: it skips 0,
       so faultErrorRate: 0 or startupDelayMs: 0 would be dropped. */}}
  {{- range $key, $env := dict "faultErrorRate" "FAULT_ERROR_RATE" "faultLatencyMs" "FAULT_LATENCY_MS" "startupDelayMs" "STARTUP_DELAY_MS" }}
  {{- $v := index $.Values.config $key }}
  {{- if not (kindIs "invalid" $v) }}
  {{ $env }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
