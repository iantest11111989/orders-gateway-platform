# Ingresses for the platform UIs (Argo CD, Grafana, Prometheus, Alertmanager),
# each on its own Traefik entrypoint. Plain manifests in system/edge/.
# Wave 25: after Traefik (10) and observability (20), whose `monitoring`
# namespace the Grafana/Prometheus/Alertmanager Ingresses live in.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edge
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: orders-gateway-platform
  annotations:
    argocd.argoproj.io/sync-wave: "25"
    argocd.argoproj.io/manifest-generate-paths: "/system/edge"
  # Pruning or deleting this Application also deletes what it created;
  # without it, a rename orphaned the old resources.
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: {{ .Values.repo.url }}
    targetRevision: {{ .Values.repo.revision }}
    path: system/edge
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Auto-sync does not retry a failed sync of the same revision on its own;
    # this covers transient failures such as a CRD not yet Established.
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
    syncOptions:
      # A route may still apply before its backend Service is ready; that's
      # fine, it resolves once the Service appears.
      - SkipDryRunOnMissingResource=true
