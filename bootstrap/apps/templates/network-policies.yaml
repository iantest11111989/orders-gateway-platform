# NetworkPolicies for the platform namespaces (system/network-policies/):
# deny ingress by default, then allow each namespace's own pods, the nodes,
# and the cross-namespace flows the platform uses. The app namespaces get
# theirs from the orders-gateway chart; Argo CD's come with its chart.
# Wave 30: every namespace it covers exists by then (waves 10-25).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-policies
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform-demo
  annotations:
    argocd.argoproj.io/sync-wave: "30"
    argocd.argoproj.io/manifest-generate-paths: "/system/network-policies"
  # Pruning or deleting this Application also deletes what it created;
  # without it, a rename orphaned the old resources.
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: {{ .Values.repo.url }}
    targetRevision: {{ .Values.repo.revision }}
    path: system/network-policies
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
