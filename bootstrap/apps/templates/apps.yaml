{{- $envs := list }}
{{- range list "dev" "staging" "prod" }}
{{- if or (not $.Values.env) (eq $.Values.env .) }}{{ $envs = append $envs . }}{{ end }}
{{- end }}
{{- /* One cluster per environment (the AWS design) sets env; locally it's
     unset, so every environment renders. */}}
# One Application <app>-<env> per env file cd/<app>/<env>.yaml, in namespace
# <env>, Helm release <app>. With `version: X` it uses chart X from the
# in-stack registry; without, helm/<app> from Git (dev-only builds).
# autoSync defaults to true for dev, false for staging and prod. Wave 40.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform-demo
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # Parameters: the env file's keys plus .path.basename (the app).
    - git:
        repoURL: {{ .Values.repo.url }}
        revision: {{ .Values.repo.revision }}
        files:
          {{- range $envs }}
          - path: cd/*/{{ . }}.yaml
          {{- end }}
  template:
    metadata:
      name: {{ `'{{ .path.basename }}-{{ .env }}'` }}
      namespace: argocd
      labels:
        app.kubernetes.io/part-of: platform-demo
        app.kubernetes.io/name: {{ `'{{ .path.basename }}'` }}
      finalizers: [resources-finalizer.argocd.argoproj.io]
    spec:
      project: default
      sources: []
      destination:
        server: https://kubernetes.default.svc
        namespace: {{ `'{{ .env }}'` }}
      syncPolicy:
        retry:
          limit: 5
          backoff: {duration: 5s, factor: 2, maxDuration: 1m}
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/audit: restricted
        syncOptions:
          - CreateNamespace=true
          # Prune last, so a renamed object never leaves the env without one.
          - PruneLast=true
  templatePatch: |
    {{`{{- $app := .path.basename }}
    {{- $values := printf "%s/values.yaml" .path.path }}
    {{- $env := printf "%s/%s" .path.path .path.filename }}
    {{- $auto := eq .env "dev" }}
    {{- if hasKey . "autoSync" }}{{ $auto = eq (toString .autoSync) "true" }}{{ end }}`}}
    metadata:
      labels:
        # auto or manual (autoSync), for people reading Argo CD.
        sync-mode: {{`'{{ if $auto }}auto{{ else }}manual{{ end }}'`}}
      annotations:
        # The files each rendering reads, so a commit that touches none of
        # them skips the re-render (pays off with a Git webhook).
        argocd.argoproj.io/manifest-generate-paths: {{`'{{ if hasKey . "version" }}{{ else }}/helm/{{ $app }};{{ end }}/{{ $values }};/{{ $env }}'`}}
    spec:
    {{`{{- if $auto }}`}}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{`{{- end }}`}}
    {{`{{- if hasKey . "version" }}`}}
      sources:
        - repoURL: registry.registry.svc.cluster.local:5000/charts
          chart: {{`'{{ $app }}'`}}
          targetRevision: {{`'{{ .version }}'`}}
          helm:
            releaseName: {{`'{{ $app }}'`}}
            valueFiles:
              - {{`'$values/{{ $values }}'`}}
              - {{`'$values/{{ $env }}'`}}
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          ref: values
    {{`{{- else }}`}}
      sources:
        - repoURL: {{ .Values.repo.url }}
          targetRevision: {{ .Values.repo.revision }}
          path: {{`'helm/{{ $app }}'`}}
          helm:
            releaseName: {{`'{{ $app }}'`}}
            valueFiles:
              - {{`'../../{{ $values }}'`}}
              - {{`'../../{{ $env }}'`}}
    {{`{{- end }}`}}
