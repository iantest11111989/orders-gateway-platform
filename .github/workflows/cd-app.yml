# CD for the app: every merge to main that touches it. Tests again, builds
# and pushes the images, signs and scans them, deploys to dev by committing
# the image to cd/orders-gateway/dev.yaml (Argo CD syncs it), then opens the staging
# and prod promotion PRs (decisions 0013-0015).
name: CD · app

on:
  push:
    branches: [main]
    paths: ["apps/orders-gateway/**", "!apps/orders-gateway/k6/**", "!apps/orders-gateway/**/*.md", ".github/workflows/cd-app.yml", "scripts/sign-images.sh", "scripts/scan-image.sh"]
  # Re-publish the images from main by hand (Actions tab, "Run workflow").
  workflow_dispatch:

# Least privilege: jobs read the repo; only `publish` and `sign` may write
# packages, only `sign` may request an OIDC token, `promote-dev` may push
# dev's values to main, and `promote-prs` may push promote/<env> branches
# and open PRs from them.
permissions:
  contents: read

concurrency:
  group: cd-app-${{ github.ref }}
  # Never cancel a publish half-way through its tags.
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/orders-gateway
  # Vulnerability scanner for scripts/scan-image.sh, pinned by tag and digest;
  # a regex manager in renovate.json5 keeps it current.
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

defaults:
  run:
    working-directory: apps/orders-gateway

jobs:
  # The app (server.js) has no dependencies, so its own tests run in the same
  # pinned Node image the Dockerfile builds from: no setup action to pin.
  test:
    name: "1 · Test"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests and syntax check (npm test, npm run lint)
        run: |
          node_image=$(sed -n 's/^FROM \(node:[^ ]*\) AS app$/\1/p' Dockerfile)
          docker run --rm -v "$PWD":/app -w /app "$node_image" sh -c 'npm test && npm run lint'

  lint:
    name: "1 · Lint (Dockerfile)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker run --rm -i hadolint/hadolint:v2.14.0@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e < Dockerfile

  # Publishes multi-arch images to GHCR from main, after the tests pass:
  #   sha-<12 chars>, main   this commit (what cd/orders-gateway/dev.yaml deploys)
  #   v1, v2                 the demo images, rebuilt from
  #                          the same commit so they stay in step with the code
  # No :latest (policy rejects it). Each push exposes its digest as a job
  # output; `sign` signs those digests.
  publish:
    name: "2 · Build and push"
    if: github.ref == 'refs/heads/main'
    needs: [test, lint]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest-main: ${{ steps.main.outputs.digest }}
      digest-v1: ${{ steps.v1.outputs.digest }}
      digest-v2: ${{ steps.v2.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: short
        run: echo "sha=${GITHUB_SHA::12}" >>"$GITHUB_OUTPUT"
      # The four builds share this job's buildx cache, so after the first one
      # they only redo the final layers.
      - id: main
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/orders-gateway
          platforms: linux/amd64,linux/arm64
          push: true
          # BuildKit SBOM for each platform, stored in the image index (and so
          # covered by the cosign signature on the index digest).
          sbom: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.short.outputs.sha }}
            ${{ env.IMAGE }}:main
          # Links the package to this repo on GitHub (and its visibility).
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            VERSION=sha-${{ steps.short.outputs.sha }}
            COMMIT=${{ github.sha }}
      - id: v1
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/orders-gateway
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          tags: ${{ env.IMAGE }}:v1
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            VERSION=v1
            COMMIT=${{ github.sha }}
      - id: v2
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/orders-gateway
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          tags: ${{ env.IMAGE }}:v2
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            VERSION=v2
            COMMIT=${{ github.sha }}
            FEATURES=delivery-estimates
      - name: Summary
        env:
          D_MAIN: ${{ steps.main.outputs.digest }}
          D_V1: ${{ steps.v1.outputs.digest }}
          D_V2: ${{ steps.v2.outputs.digest }}
          SHORT: ${{ steps.short.outputs.sha }}
        run: |
          {
            echo "| Tag | Digest |"
            echo "| --- | --- |"
            echo "| \`sha-$SHORT\`, \`main\` | \`$D_MAIN\` |"
            echo "| \`v1\` | \`$D_V1\` |"
            echo "| \`v2\` | \`$D_V2\` |"
          } >>"$GITHUB_STEP_SUMMARY"

  # Keyless cosign signatures (Sigstore, GitHub OIDC), by digest: the demo
  # tags are re-pushed from every main commit, so a signature on a tag would
  # go stale. Each signature records this workflow and ref, which is what a
  # verifying admission policy checks. The SBOMs are inside the signed index.
  sign:
    name: "3 · Sign"
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # the signature is pushed next to the image
      id-token: write # the OIDC token Fulcio issues the signing certificate for
    steps:
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sign, then verify signature and SBOMs
        working-directory: .
        env:
          # e.g. https://github.com/<owner>/<repo>/.github/workflows/app.yml@refs/heads/main
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
          D_MAIN: ${{ needs.publish.outputs.digest-main }}
          D_V1: ${{ needs.publish.outputs.digest-v1 }}
          D_V2: ${{ needs.publish.outputs.digest-v2 }}
        run: |
          scripts/sign-images.sh "$D_MAIN" "$D_V1" "$D_V2" |
            tee -a "$GITHUB_STEP_SUMMARY"

  # Scans the published image before dev gets it. The PR
  # already scanned the same code; this catches vulnerabilities published
  # since. The demo tags are built from the same code and dependencies, so
  # the main image stands in for them.
  scan:
    name: "3 · Scan"
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fixable HIGH/CRITICAL vulnerabilities fail the job
        working-directory: .
        env:
          DIGEST: ${{ needs.publish.outputs.digest-main }}
        run: scripts/scan-image.sh "$IMAGE@$DIGEST"

  # Points dev at the image this commit just published and signed: it bumps
  # the image in cd/orders-gateway/dev.yaml and Argo CD deploys it. It runs only after `sign` and
  # `scan`, so dev never runs an unsigned digest or one with a fixable
  # HIGH/CRITICAL vulnerability. The commit goes straight to main as
  # github-actions[bot]; a push made with GITHUB_TOKEN starts no workflows, so
  # it can't loop. Runs on main are serialized by the workflow's concurrency
  # group, so the newest commit's image wins. Staging and prod move by
  # promotion PRs (job promote-prs).
  promote-dev:
    name: "4 · Deploy dev"
    needs: [publish, sign, scan]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the one-line commit to cd/orders-gateway/dev.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true # this job pushes
      - name: Set dev to sha-<commit>@<digest>, commit, push
        working-directory: .
        env:
          DIGEST: ${{ needs.publish.outputs.digest-main }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          tag="sha-${GITHUB_SHA::12}"
          scripts/set-image.sh dev "$tag" "$DIGEST"
          if git diff --quiet; then
            echo "dev already runs $tag@$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "dev: orders-gateway $tag" \
            -m "Image $IMAGE@$DIGEST, published and signed by $RUN_URL (commit $GITHUB_SHA)."
          # main may have moved since checkout; replay this one-line change on top.
          for attempt in 1 2 3; do
            git push origin HEAD:main && break
            [ "$attempt" = 3 ] && { echo "::error::push to main failed 3 times"; exit 1; }
            git pull -q --rebase origin main
          done
          echo "dev now runs \`$tag\` (\`$DIGEST\`): $(git rev-parse --short HEAD)" >>"$GITHUB_STEP_SUMMARY"

  # Opens (or refreshes) one promotion PR per environment for the image dev
  # just got: branch promote/<env>, rebuilt from main with only that env's
  # image line changed (scripts/set-image.sh). The owner approves and merges
  # them.
  # Needs the repository setting "Allow GitHub Actions to create and approve
  # pull requests"; without it the job warns and main stays green. PRs opened
  # with GITHUB_TOKEN start no workflows, so it dispatches the platform checks
  # on each branch.
  promote-prs:
    name: "5 · Promote (staging and prod PRs)"
    needs: [publish, promote-dev]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push promote/<env> branches
      pull-requests: write # open or update the PRs
      actions: write # dispatch the platform checks on those branches
    strategy:
      fail-fast: false
      matrix:
        env: [staging, prod]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true # this job pushes its branch
      - name: Rebuild promote/${{ matrix.env }} and open or update its PR
        working-directory: .
        env:
          ENV: ${{ matrix.env }}
          DIGEST: ${{ needs.publish.outputs.digest-main }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="sha-${GITHUB_SHA::12}"
          branch="promote/$ENV"
          scripts/set-image.sh "$ENV" "$tag" "$DIGEST"
          if git diff --quiet; then
            echo "$ENV already runs $tag" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$branch"
          git commit -q -am "$ENV: orders-gateway $tag" \
            -m "Image $IMAGE@$DIGEST, published and signed by $RUN_URL (commit $GITHUB_SHA)."
          # The branch belongs to this job: each run rebuilds it from main, so
          # the PR always shows exactly one change against the newest image.
          # Refuse if someone else committed to it, so a hand-made commit is
          # never overwritten.
          if git fetch -q origin "refs/heads/$branch" 2>/dev/null; then
            author=$(git log -1 --format=%an FETCH_HEAD)
            if [ "$author" != "github-actions[bot]" ]; then
              echo "::error::$branch was last committed by '$author', not CI; not overwriting it. Merge or delete it first."
              exit 1
            fi
          fi
          git push -q --force origin "HEAD:refs/heads/$branch"
          title="Promote $ENV to $tag"
          body="Moves **$ENV** to \`$tag\` (\`$DIGEST\`), the image dev runs now.
          It was published and signed by $RUN_URL.
          **Needs the owner's approval.** (In production a patch promoter would merge patches on its own: docs/production-on-aws.md.)"
          [ "$ENV" = prod ] && body="$body
          Merging starts a rolling update of prod's Deployment (maxUnavailable 0)."
          body="$body

          Opened by CI; a newer image replaces this PR's commit. Checks run through workflow_dispatch."
          pr=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body "$body" >/dev/null
          elif ! pr=$(gh pr create --head "$branch" --base main --title "$title" --body "$body" 2>err.txt); then
            cat err.txt >&2
            # Only the missing repository setting is expected; anything else fails.
            if grep -q 'not permitted to create or approve pull requests' err.txt; then
              echo "::warning::could not open the $ENV promotion PR. Turn on Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests'. Branch $branch is pushed."
              exit 0
            fi
            exit 1
          fi
          gh workflow run platform.yml --ref "$branch"
          echo "$ENV: $pr ($tag)" >>"$GITHUB_STEP_SUMMARY"
