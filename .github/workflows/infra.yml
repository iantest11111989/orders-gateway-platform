name: CI · infra

# Fast platform checks: lint, manifest validation, toolbox image. The cluster
# test is e2e.yml.

on:
  pull_request:
    paths: ["platform", "pipeline", "docker-compose.yml", "scripts/**", "toolbox/**", "cluster/**", "bootstrap/**", "system/**", "helm/**", "cd/**", "alerts/**", "policies/**", ".github/workflows/**", ".shellcheckrc"]
  push:
    branches: [main]
    paths: ["platform", "pipeline", "docker-compose.yml", "scripts/**", "toolbox/**", "cluster/**", "bootstrap/**", "system/**", "helm/**", "cd/**", "alerts/**", "policies/**", ".github/workflows/**", ".shellcheckrc"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Lint (shellcheck, actionlint)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD":/mnt -w /mnt \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            -x platform pipeline scripts/*.sh scripts/lib/host.sh toolbox/install-tools.sh
      - name: docker-compose.yml uses the current toolbox image
        run: sh scripts/check-compose-toolbox.sh
      - name: actionlint
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  # Everything Argo CD would apply, checked in a minute without a cluster.
  validate:
    name: "Validate manifests (helm lint, kubeconform, policies)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Render (helm lint, helm template, kustomize)"
        run: ./platform shell scripts/validate-manifests.sh
      # CRD schemas pinned to a commit so upstream changes can't turn CI red.
      - name: "Schemas (kubeconform, strict: Kubernetes and CRDs)"
        run: |
          docker run --rm -v "$PWD/out/rendered:/r:ro" \
            ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c \
            -strict -summary -output text \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/04af58d740718c4dc719441bf39fb284c784f4a8/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /r
      # Two policies are left to policies.yml and e2e: the label pair (the CLI
      # skips default-labels' mutation) and signatures (need real signatures).
      - name: "Policies (kyverno apply)"
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w \
            ghcr.io/kyverno/kyverno-cli:v1.20.0@sha256:bd2b8b7c9d550ecf04e0bacaf351adce2f82ce67fd3f291075edcee7f8ab4ab4 \
            apply policies/disallow-latest-tag.yaml policies/disallow-latest-tag-platform.yaml \
              policies/require-non-root-readonly.yaml policies/require-probes.yaml \
              policies/require-resources.yaml policies/restrict-image-registries.yaml \
            --resource out/policy-input/apps.yaml >"$RUNNER_TEMP/kyverno.txt" 2>&1 || { cat "$RUNNER_TEMP/kyverno.txt"; exit 1; }
          grep -E "^(Applying|pass:)" "$RUNNER_TEMP/kyverno.txt"
          grep -qE "^pass: [1-9][0-9]*, fail: 0, warn: 0, error: 0" "$RUNNER_TEMP/kyverno.txt"

  toolbox:
    name: "Build toolbox (amd64 + arm64)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build only; toolbox-publish pushes from main.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: toolbox
          platforms: linux/amd64,linux/arm64
          push: false

  # Publishes the toolbox from main so ./platform can pull it. The tag is the
  # same toolbox/ hash ./platform computes (scripts/lib/host.sh).
  toolbox-publish:
    name: "Publish toolbox (main only)"
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: toolbox
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push the image and its signature
      id-token: write # keyless signing
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/orders-gateway-platform-toolbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tag
        name: Tag = hash of toolbox/ (same as ./platform)
        run: |
          hash=$(cd toolbox && find . -type f | LC_ALL=C sort | xargs cat | sha256sum | cut -c1-12)
          echo "tag=sha-$hash" >>"$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      # Already published but not verifiably signed (sign failed after push):
      # sign that digest now.
      - id: exists
        name: Already published and signed?
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          if digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest) && [ -n "$digest" ]; then
            echo "digest=$digest" >>"$GITHUB_OUTPUT"
            if cosign verify "$IMAGE@$digest" --certificate-identity "$IDENTITY" \
                 --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null 2>&1; then
              echo "signed=true" >>"$GITHUB_OUTPUT"
              echo "\`$IMAGE:$TAG\` is already published and signed" >>"$GITHUB_STEP_SUMMARY"
            fi
          fi
      - if: steps.exists.outputs.digest == ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        if: steps.exists.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: toolbox
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Sign, then verify signature and SBOMs
        if: steps.exists.outputs.signed != 'true'
        env:
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
          DIGEST: ${{ steps.build.outputs.digest || steps.exists.outputs.digest }}
        run: scripts/sign-images.sh "$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
