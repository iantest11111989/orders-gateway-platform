name: platform

on:
  pull_request:
    paths: ["platform", "scripts/**", "toolbox/**", "cluster/**", "gitops/**", "charts/**", "environments/**", "alerts/**", ".github/workflows/**", ".shellcheckrc"]
  push:
    branches: [main]
    paths: ["platform", "scripts/**", "toolbox/**", "cluster/**", "gitops/**", "charts/**", "environments/**", "alerts/**", ".github/workflows/**", ".shellcheckrc"]
  # The promotion PRs (app.yml, job promote-prs) are opened with GITHUB_TOKEN,
  # which starts no pull_request workflows; that job dispatches this one on
  # the PR's branch instead, and the results show on the PR's head commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: shellcheck + actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD":/mnt -w /mnt \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            -x platform scripts/*.sh toolbox/install-tools.sh
      - name: actionlint
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  toolbox:
    name: toolbox builds (amd64 + arm64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build only (every download is checksum-verified during the build);
      # `toolbox-publish` pushes it from main.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: toolbox
          platforms: linux/amd64,linux/arm64
          push: false

  # Publishes the toolbox from main, so `./platform` pulls it instead of
  # building it locally (minutes on a fresh machine). The tag is the same hash
  # of toolbox/ that `./platform` computes (toolbox_image in ./platform), so a
  # change to any pinned tool gives a new tag, and an unchanged toolbox isn't
  # rebuilt. Signed and checked like the app image (scripts/sign-images.sh,
  # decision 0013), with this workflow on main as the identity.
  toolbox-publish:
    name: publish toolbox (amd64 + arm64)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: toolbox
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push the image and its signature
      id-token: write # keyless signing
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/orders-gateway-platform-toolbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tag
        name: Tag = hash of toolbox/ (same as ./platform)
        run: |
          hash=$(cd toolbox && find . -type f | LC_ALL=C sort | xargs cat | sha256sum | cut -c1-12)
          echo "tag=sha-$hash" >>"$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        name: Skip if this toolbox is already published
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "already=true" >>"$GITHUB_OUTPUT"
            echo "\`$IMAGE:$TAG\` is already published" >>"$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.exists.outputs.already != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        if: steps.exists.outputs.already != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: toolbox
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - if: steps.exists.outputs.already != 'true'
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Sign, then verify signature and SBOMs
        if: steps.exists.outputs.already != 'true'
        env:
          # e.g. https://github.com/<owner>/<repo>/.github/workflows/platform.yml@refs/heads/main
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: scripts/sign-images.sh "$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"

  cluster:
    name: ./platform doctor, up, up again, down
    runs-on: ubuntu-24.04
    env:
      # Argo CD syncs from this PR's own branch (or main on push).
      REPO_URL: https://github.com/${{ github.event.pull_request.head.repo.full_name || github.repository }}.git
      REVISION: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./platform doctor # runners have 4 CPUs: a warning, not a failure
      - run: ./platform up
      # A cold start is mostly image pulls (nothing is cached on a runner),
      # so list the slowest: a slow `up` can be explained from this log.
      - name: Slowest image pulls
        run: |
          ./platform kubectl get events -A --field-selector reason=Pulled \
            -o jsonpath='{range .items[*]}{.message}{"\n"}{end}' |
            awk 'match($0, /^Successfully pulled image "[^"]+" in [0-9hms.]+/) {
              split(substr($0, RSTART, RLENGTH), f, "\"")
              d = f[3]; sub(/^ in /, "", d); s = 0; rest = d
              if (match(rest, /[0-9.]+h/)) { s += substr(rest, RSTART, RLENGTH - 1) * 3600 }
              if (match(rest, /[0-9.]+m[^s]/) || match(rest, /[0-9.]+m$/)) { v = substr(rest, RSTART); sub(/m.*/, "", v); s += v * 60 }
              if (match(rest, /[0-9.]+ms/)) { s += substr(rest, RSTART, RLENGTH - 2) / 1000 }
              else if (match(rest, /[0-9.]+s/)) { s += substr(rest, RSTART, RLENGTH - 1) }
              printf "%7.1fs  %s\n", s, f[2]
            }' | sort -rn | head -20
      - run: ./platform up # idempotent
      - run: ./platform kubectl get nodes -L topology.kubernetes.io/zone
      - run: ./platform kubectl -n argocd get applications
      # Apps, scrape targets, logs, HTTPS and policies (includes check-https).
      # Right after `up` a target may not have been scraped yet: retry a bit.
      - name: ./platform verify
        run: |
          for attempt in 1 2 3; do
            ./platform verify && exit 0
            echo "verify attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          exit 1
      # A fresh up only creates the prod route; this also checks an upgrade.
      - run: ./platform shell scripts/check-route-upgrade.sh
      # The Application health check the root's sync waves rely on (#31).
      - run: ./platform shell scripts/test-argocd-health.sh
      # Measured CPU/memory against the 6 CPU / 12 GiB budget, plus OOM kills.
      - run: ./platform budget --watch 30
      # On failure, show why: pods that aren't ready, their descriptions
      # (image pulls, probes, OOM) and recent events. Best effort: the cluster
      # may not exist if `up` failed early.
      - name: Diagnostics (on failure)
        if: failure()
        run: |
          ./platform kubectl get pods -A -o wide || true
          ./platform kubectl get events -A --sort-by=.lastTimestamp || true
          # Not ready, or restarted: a pod that crashed and came back is
          # Ready again by the time this runs, but its last run explains it.
          ./platform kubectl get pods -A --no-headers 2>/dev/null \
            | awk '{ split($3, r, "/") } (r[1] != r[2] || $5 + 0 > 0) && $4 != "Completed"' \
            | while read -r ns pod _; do
                echo "::group::describe $ns/$pod"
                ./platform kubectl -n "$ns" describe pod "$pod" || true
                ./platform kubectl -n "$ns" logs "$pod" --all-containers --tail=50 || true
                # A crash-looping container's useful output is in its last run.
                ./platform kubectl -n "$ns" logs "$pod" --all-containers --tail=50 --previous 2>/dev/null || true
                echo "::endgroup::"
              done
      - if: always()
        run: ./platform down
