name: platform

on:
  pull_request:
    paths: ["platform", "docker-compose.yml", "scripts/**", "toolbox/**", "cluster/**", "gitops/**", "charts/**", "environments/**", "alerts/**", ".github/workflows/**", ".shellcheckrc"]
  push:
    branches: [main]
    paths: ["platform", "docker-compose.yml", "scripts/**", "toolbox/**", "cluster/**", "gitops/**", "charts/**", "environments/**", "alerts/**", ".github/workflows/**", ".shellcheckrc"]
  # The promotion PRs (app.yml, job promote-prs) are opened with GITHUB_TOKEN,
  # which starts no pull_request workflows; that job dispatches this one on
  # the PR's branch instead, and the results show on the PR's head commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: shellcheck + actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD":/mnt -w /mnt \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            -x platform scripts/*.sh toolbox/install-tools.sh
      - name: docker-compose.yml uses the current toolbox image
        run: sh scripts/check-compose-toolbox.sh
      - name: actionlint
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  toolbox:
    name: toolbox builds (amd64 + arm64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build only (every download is checksum-verified during the build);
      # `toolbox-publish` pushes it from main.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: toolbox
          platforms: linux/amd64,linux/arm64
          push: false

  # Publishes the toolbox from main, so `./platform` pulls it instead of
  # building it locally (minutes on a fresh machine). The tag is the same hash
  # of toolbox/ that `./platform` computes (toolbox_image in ./platform), so a
  # change to any pinned tool gives a new tag, and an unchanged toolbox isn't
  # rebuilt. Signed and checked like the app image (scripts/sign-images.sh,
  # decision 0013), with this workflow on main as the identity.
  toolbox-publish:
    name: publish toolbox (amd64 + arm64)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: toolbox
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push the image and its signature
      id-token: write # keyless signing
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/orders-gateway-platform-toolbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tag
        name: Tag = hash of toolbox/ (same as ./platform)
        run: |
          hash=$(cd toolbox && find . -type f | LC_ALL=C sort | xargs cat | sha256sum | cut -c1-12)
          echo "tag=sha-$hash" >>"$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      # Published AND signed by this workflow on main: nothing to do. Published
      # but not (verifiably) signed, e.g. a sign step that failed after the
      # push: sign that digest now instead of leaving it unsigned for good.
      - id: exists
        name: Already published and signed?
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          if digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest) && [ -n "$digest" ]; then
            echo "digest=$digest" >>"$GITHUB_OUTPUT"
            if cosign verify "$IMAGE@$digest" --certificate-identity "$IDENTITY" \
                 --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null 2>&1; then
              echo "signed=true" >>"$GITHUB_OUTPUT"
              echo "\`$IMAGE:$TAG\` is already published and signed" >>"$GITHUB_STEP_SUMMARY"
            fi
          fi
      - if: steps.exists.outputs.digest == ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        if: steps.exists.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: toolbox
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Sign, then verify signature and SBOMs
        if: steps.exists.outputs.signed != 'true'
        env:
          # e.g. https://github.com/<owner>/<repo>/.github/workflows/platform.yml@refs/heads/main
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
          # The new build's digest, or the published-but-unsigned one.
          DIGEST: ${{ steps.build.outputs.digest || steps.exists.outputs.digest }}
        run: scripts/sign-images.sh "$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"

  cluster:
    name: ./platform doctor, up, up again, down
    runs-on: ubuntu-24.04
    env:
      # Argo CD syncs the exact commit this job checks out, so verify.sh and
      # the manifests it checks always match. On a PR that's the merge commit
      # (github.sha, refs/pull/N/merge in this repo, fetchable by SHA, fork
      # PRs included); syncing the branch head instead tested an out-of-date
      # branch's manifests against main's scripts (#54). On push, schedule
      # and dispatch it's the branch.
      REPO_URL: https://github.com/${{ github.repository }}.git
      REVISION: ${{ github.event_name == 'pull_request' && github.sha || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./platform doctor # runners have 4 CPUs: a warning, not a failure
      # The images a recent run on main used, so a cold start doesn't hinge on
      # every registry answering (ECR Public 429s, ErrImagePull; see
      # scripts/images.sh). The key never matches exactly: restore-keys picks
      # the newest cache for this runner's architecture.
      - name: Restore the image cache
        id: images
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/images
          key: images-v2-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: images-v2-${{ runner.arch }}-
      # The reviewer's entry point (the brief's fixed contract): Compose's
      # `ready` service bootstraps everything and is healthy only when every
      # Argo CD Application is Synced and Healthy and prod serves.
      - name: docker compose up -d --wait
        run: docker compose up -d --wait --wait-timeout 1200
        env:
          PRELOAD_IMAGES: .cache/images
      - name: Compose logs (on failure)
        if: failure()
        run: docker compose logs --tail=200 ready || true
      # ./out/kubeconfig.yaml must work from the host, with the host's kubectl.
      - name: kubeconfig from the host
        run: kubectl --kubeconfig out/kubeconfig.yaml get nodes
      # Restarts: stopping and starting Compose must come back healthy with the
      # cluster (and its data) untouched.
      - name: docker compose stop, then up again
        run: |
          docker compose stop
          docker compose up -d --wait --wait-timeout 600
          kubectl --kubeconfig out/kubeconfig.yaml get nodes
      # A cold start is mostly image pulls (nothing is cached on a runner),
      # so list the slowest: a slow `up` can be explained from this log.
      - name: Slowest image pulls
        run: |
          ./platform kubectl get events -A --field-selector reason=Pulled \
            -o jsonpath='{range .items[*]}{.message}{"\n"}{end}' |
            awk 'match($0, /^Successfully pulled image "[^"]+" in [0-9hms.]+/) {
              split(substr($0, RSTART, RLENGTH), f, "\"")
              d = f[3]; sub(/^ in /, "", d); s = 0; rest = d
              if (match(rest, /[0-9.]+h/)) { s += substr(rest, RSTART, RLENGTH - 1) * 3600 }
              if (match(rest, /[0-9.]+m[^s]/) || match(rest, /[0-9.]+m$/)) { v = substr(rest, RSTART); sub(/m.*/, "", v); s += v * 60 }
              if (match(rest, /[0-9.]+ms/)) { s += substr(rest, RSTART, RLENGTH - 2) / 1000 }
              else if (match(rest, /[0-9.]+s/)) { s += substr(rest, RSTART, RLENGTH - 1) }
              printf "%7.1fs  %s\n", s, f[2]
            }' | sort -rn | head -20
      - run: ./platform up # idempotent
      - run: ./platform kubectl get nodes -L topology.kubernetes.io/zone
      - run: ./platform kubectl -n argocd get applications
      # One ReplicaSet means the Envoy proxy didn't roll during bootstrap
      # (#46). More is a regression worth seeing, not worth failing CI over.
      - name: Envoy proxy rolled during bootstrap?
        run: |
          ./platform kubectl -n envoy-gateway-system get replicasets -l app.kubernetes.io/component=proxy
          n=$(./platform kubectl -n envoy-gateway-system get replicasets -l app.kubernetes.io/component=proxy --no-headers | grep -c . || true)
          if [ "$n" -gt 1 ]; then
            echo "::warning::the Envoy proxy has $n ReplicaSets after up: it rolled during bootstrap (see #46)"
          fi
      # Apps, scrape targets, logs, HTTPS and policies (includes check-https).
      # Right after `up` a target may not have been scraped yet: retry a bit.
      - name: ./platform verify
        run: |
          for attempt in 1 2 3; do
            ./platform verify && exit 0
            echo "verify attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          exit 1
      # The Application health check the root's sync waves rely on (#31).
      - run: ./platform shell scripts/test-argocd-health.sh
      # Measured CPU/memory against the 6 CPU / 12 GiB budget, plus OOM kills.
      - run: ./platform budget --watch 30
      # Refresh the image cache from main when the set of images changed (a
      # chart or image bump). Only main and manual runs save: PR caches are
      # scoped to their branch and would only crowd out main's (10 GB cap).
      - name: Image cache up to date?
        id: imagelist
        if: github.event_name != 'pull_request'
        run: |
          # The same list scripts/images.sh save writes (tagged images, kind's
          # own left out), so the key changes exactly when the cache would.
          ./platform shell scripts/images.sh list >"$RUNNER_TEMP/images.txt"
          key="images-v2-${RUNNER_ARCH}-$(sha256sum "$RUNNER_TEMP/images.txt" | cut -c1-16)"
          echo "key=$key" >>"$GITHUB_OUTPUT"
          if [ "$key" = "${{ steps.images.outputs.cache-matched-key }}" ]; then
            echo "the restored cache ($key) already has these images"
          else
            echo "save=1" >>"$GITHUB_OUTPUT"
            echo "image set changed: restored '${{ steps.images.outputs.cache-matched-key }}', now $key"
          fi
      - name: Build the image cache
        if: steps.imagelist.outputs.save == '1'
        run: ./platform shell scripts/images.sh save .cache/images
      - name: Save the image cache
        if: steps.imagelist.outputs.save == '1'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/images
          key: ${{ steps.imagelist.outputs.key }}
      # On failure, show why: pods that aren't ready, their descriptions
      # (image pulls, probes, OOM) and recent events. Best effort: the cluster
      # may not exist if `up` failed early.
      - name: Diagnostics (on failure)
        if: failure()
        run: |
          ./platform kubectl get pods -A -o wide || true
          ./platform kubectl get events -A --sort-by=.lastTimestamp || true
          # Not ready, or restarted: a pod that crashed and came back is
          # Ready again by the time this runs, but its last run explains it.
          ./platform kubectl get pods -A --no-headers 2>/dev/null \
            | awk '{ split($3, r, "/") } (r[1] != r[2] || $5 + 0 > 0) && $4 != "Completed"' \
            | while read -r ns pod _; do
                echo "::group::describe $ns/$pod"
                ./platform kubectl -n "$ns" describe pod "$pod" || true
                ./platform kubectl -n "$ns" logs "$pod" --all-containers --tail=50 || true
                # A crash-looping container's useful output is in its last run.
                ./platform kubectl -n "$ns" logs "$pod" --all-containers --tail=50 --previous 2>/dev/null || true
                echo "::endgroup::"
              done
      - if: always()
        run: |
          docker compose down || true
          ./platform down
