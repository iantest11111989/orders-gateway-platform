name: CI · renovate config

# Validates renovate.json5. The other workflows are path-filtered and don't
# cover it, so without this a config change would have no check at all.
on:
  pull_request:
    paths: ["renovate.json5", ".github/workflows/renovate-config.yml"]
  push:
    branches: [main]
    paths: ["renovate.json5", ".github/workflows/renovate-config.yml"]

permissions:
  contents: read

jobs:
  validate:
    name: renovate-config-validator
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned by tag and digest; a regex manager in renovate.json5 keeps it current.
      - name: Validate (strict)
        run: |
          docker run --rm -v "$PWD:/r:ro" -w /r \
            --entrypoint renovate-config-validator \
            renovate/renovate:44.261.0@sha256:c906ab3da4b0dcf3a278822a578a4850e35c1173677515654b3d2a40d81d00d1 \
            --strict renovate.json5
