name: app

on:
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml", "scripts/sign-images.sh"]
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml", "scripts/sign-images.sh"]
  # Re-publish the images from main by hand (Actions tab, "Run workflow").
  workflow_dispatch:

# Least privilege: jobs read the repo; only `publish` and `sign` may write
# packages, only `sign` and the PR `image` job (signing rehearsal) may
# request an OIDC token, and only `promote-dev` may push (to dev's values).
permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  # Never cancel a publish half-way through its tags.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/orders-gateway

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: build, vet, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 -cover ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: app

  # Pull requests build the image without pushing: only main publishes, so
  # every published image comes from reviewed code (and, with signing,
  # verifies against this workflow on refs/heads/main).
  # It also rehearses the signing on main: the image goes to a throwaway
  # registry on localhost (nothing public), and scripts/sign-images.sh signs
  # and checks it exactly as the `sign` job does, so a broken signing step
  # fails here instead of after main has published. The keyless signature
  # names this PR's ref and lands in the public Rekor log, like main's do.
  image:
    name: image builds (amd64 + arm64), signing rehearsal
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # keyless signing of the localhost image
    services:
      registry:
        image: docker.io/library/registry:3.1.2@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host # so BuildKit can reach localhost:5000
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          tags: localhost:5000/orders-gateway:pr
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
      # The v2-bad demo stage, so a PR that breaks it fails before main.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          target: bad
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=ci-bad
            COMMIT=${{ github.sha }}
            FEATURES=delivery-estimates
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Signing rehearsal (localhost registry)
        # Fork PRs get no OIDC token, so they skip the rehearsal.
        if: github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        env:
          IMAGE: localhost:5000/orders-gateway
          # .../.github/workflows/app.yml@refs/pull/<n>/merge
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: scripts/sign-images.sh "$DIGEST"

  # Publishes multi-arch images to GHCR from main, after the tests pass:
  #   sha-<12 chars>, main   this commit (what environments/dev deploys)
  #   v1, v2, v2-bad         the demo images (brief, section 5), rebuilt from
  #                          the same commit so they stay in step with the code
  # No :latest (policy rejects it). Each push exposes its digest as a job
  # output; `sign` signs those digests.
  publish:
    name: publish images (amd64 + arm64)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, lint]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest-main: ${{ steps.main.outputs.digest }}
      digest-v1: ${{ steps.v1.outputs.digest }}
      digest-v2: ${{ steps.v2.outputs.digest }}
      digest-v2-bad: ${{ steps.v2-bad.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: short
        run: echo "sha=${GITHUB_SHA::12}" >>"$GITHUB_OUTPUT"
      # The four builds share this job's buildx cache, so after the first one
      # they only redo the final layers.
      - id: main
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          # BuildKit SBOM for each platform, stored in the image index (and so
          # covered by the cosign signature on the index digest).
          sbom: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.short.outputs.sha }}
            ${{ env.IMAGE }}:main
          # Links the package to this repo on GitHub (and its visibility).
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            VERSION=sha-${{ steps.short.outputs.sha }}
            COMMIT=${{ github.sha }}
      - id: v1
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          tags: ${{ env.IMAGE }}:v1
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            VERSION=v1
            COMMIT=${{ github.sha }}
      - id: v2
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          tags: ${{ env.IMAGE }}:v2
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            VERSION=v2
            COMMIT=${{ github.sha }}
            FEATURES=delivery-estimates
      - id: v2-bad
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          target: bad
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          tags: ${{ env.IMAGE }}:v2-bad
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            VERSION=v2-bad
            COMMIT=${{ github.sha }}
            FEATURES=delivery-estimates
      - name: Summary
        env:
          D_MAIN: ${{ steps.main.outputs.digest }}
          D_V1: ${{ steps.v1.outputs.digest }}
          D_V2: ${{ steps.v2.outputs.digest }}
          D_V2_BAD: ${{ steps.v2-bad.outputs.digest }}
          SHORT: ${{ steps.short.outputs.sha }}
        run: |
          {
            echo "| Tag | Digest |"
            echo "| --- | --- |"
            echo "| \`sha-$SHORT\`, \`main\` | \`$D_MAIN\` |"
            echo "| \`v1\` | \`$D_V1\` |"
            echo "| \`v2\` | \`$D_V2\` |"
            echo "| \`v2-bad\` | \`$D_V2_BAD\` |"
          } >>"$GITHUB_STEP_SUMMARY"

  # Keyless cosign signatures (Sigstore, GitHub OIDC), by digest: the demo
  # tags are re-pushed from every main commit, so a signature on a tag would
  # go stale. Each signature records this workflow and ref, which is what a
  # verifying admission policy checks. The SBOMs are inside the signed index.
  sign:
    name: sign images (cosign keyless)
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # the signature is pushed next to the image
      id-token: write # the OIDC token Fulcio issues the signing certificate for
    steps:
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sign, then verify signature and SBOMs
        working-directory: .
        env:
          # e.g. https://github.com/<owner>/<repo>/.github/workflows/app.yml@refs/heads/main
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
          D_MAIN: ${{ needs.publish.outputs.digest-main }}
          D_V1: ${{ needs.publish.outputs.digest-v1 }}
          D_V2: ${{ needs.publish.outputs.digest-v2 }}
          D_V2_BAD: ${{ needs.publish.outputs.digest-v2-bad }}
        run: |
          scripts/sign-images.sh "$D_MAIN" "$D_V1" "$D_V2" "$D_V2_BAD" |
            tee -a "$GITHUB_STEP_SUMMARY"

  # Points dev at the image this commit just published and signed (brief,
  # section 10: "bump the image tag in environments/dev/values.yaml
  # automatically; Argo deploys it to dev"). It runs only after `sign`, so dev
  # never runs an unsigned digest. The commit goes straight to main as
  # github-actions[bot]; a push made with GITHUB_TOKEN starts no workflows, so
  # it can't loop. Runs on main are serialized by the workflow's concurrency
  # group, so the newest commit's image wins. Staging and prod move by
  # promotion PRs (decision 0014).
  promote-dev:
    name: promote to dev
    needs: [publish, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the one-line commit to environments/dev/values.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true # this job pushes
      - name: Set dev to sha-<commit>@<digest>, commit, push
        working-directory: .
        env:
          DIGEST: ${{ needs.publish.outputs.digest-main }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          tag="sha-${GITHUB_SHA::12}"
          scripts/set-image.sh dev "$tag" "$DIGEST"
          if git diff --quiet; then
            echo "dev already runs $tag@$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "dev: orders-gateway $tag" \
            -m "Image $IMAGE@$DIGEST, published and signed by $RUN_URL (commit $GITHUB_SHA)."
          # main may have moved since checkout; replay this one-line change on top.
          for attempt in 1 2 3; do
            git push origin HEAD:main && break
            [ "$attempt" = 3 ] && { echo "::error::push to main failed 3 times"; exit 1; }
            git pull -q --rebase origin main
          done
          echo "dev now runs \`$tag\` (\`$DIGEST\`): $(git rev-parse --short HEAD)" >>"$GITHUB_STEP_SUMMARY"
