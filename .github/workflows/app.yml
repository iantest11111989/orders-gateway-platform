name: app

on:
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  # Re-publish the images from main by hand (Actions tab, "Run workflow").
  workflow_dispatch:

# Least privilege: jobs read the repo; only `publish` may write packages.
permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  # Never cancel a publish half-way through its tags.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/orders-gateway

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: build, vet, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 -cover ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: app

  # Pull requests build the image without pushing: only main publishes, so
  # every published image comes from reviewed code (and, with signing,
  # verifies against this workflow on refs/heads/main).
  image:
    name: image builds (amd64 + arm64)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}

  # Publishes multi-arch images to GHCR from main, after the tests pass:
  #   sha-<12 chars>, main   this commit (what environments/dev deploys)
  #   v1, v2, v2-bad         the demo images (brief, section 5), rebuilt from
  #                          the same commit so they stay in step with the code
  # No :latest (policy rejects it). Each push exposes its digest as a job
  # output so signing and SBOM attestation can be added by digest.
  publish:
    name: publish images (amd64 + arm64)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, lint]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest-main: ${{ steps.main.outputs.digest }}
      digest-v1: ${{ steps.v1.outputs.digest }}
      digest-v2: ${{ steps.v2.outputs.digest }}
      digest-v2-bad: ${{ steps.v2-bad.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: short
        run: echo "sha=${GITHUB_SHA::12}" >>"$GITHUB_OUTPUT"
      # The four builds share this job's buildx cache, so after the first one
      # they only redo the final layers.
      - id: main
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.short.outputs.sha }}
            ${{ env.IMAGE }}:main
          # Links the package to this repo on GitHub (and its visibility).
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            VERSION=sha-${{ steps.short.outputs.sha }}
            COMMIT=${{ github.sha }}
      - id: v1
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:v1
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            VERSION=v1
            COMMIT=${{ github.sha }}
      - id: v2
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:v2
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            VERSION=v2
            COMMIT=${{ github.sha }}
            FEATURES=delivery-estimates
      - id: v2-bad
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          target: bad
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:v2-bad
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            VERSION=v2-bad
            COMMIT=${{ github.sha }}
            FEATURES=delivery-estimates
      - name: Summary
        env:
          D_MAIN: ${{ steps.main.outputs.digest }}
          D_V1: ${{ steps.v1.outputs.digest }}
          D_V2: ${{ steps.v2.outputs.digest }}
          D_V2_BAD: ${{ steps.v2-bad.outputs.digest }}
          SHORT: ${{ steps.short.outputs.sha }}
        run: |
          {
            echo "| Tag | Digest |"
            echo "| --- | --- |"
            echo "| \`sha-$SHORT\`, \`main\` | \`$D_MAIN\` |"
            echo "| \`v1\` | \`$D_V1\` |"
            echo "| \`v2\` | \`$D_V2\` |"
            echo "| \`v2-bad\` | \`$D_V2_BAD\` |"
          } >>"$GITHUB_STEP_SUMMARY"
