name: CI · promoter

on:
  pull_request:
    paths: ["scripts/promoter.py", "scripts/promoter_test.py", "gitops/manifests/promoter/**", ".github/workflows/promoter.yml"]
  push:
    branches: [main]
    paths: ["scripts/promoter.py", "scripts/promoter_test.py", "gitops/manifests/promoter/**", ".github/workflows/promoter.yml"]

permissions:
  contents: read

concurrency:
  group: promoter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: promoter unit tests, ConfigMap in sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's own python3; the promoter uses only the standard library.
      - run: python3 scripts/promoter_test.py -v
      - name: gitops/manifests/promoter/script.yaml is current
        run: |
          python3 scripts/promoter.py configmap | diff -u gitops/manifests/promoter/script.yaml - ||
            { echo "::error::run: python3 scripts/promoter.py configmap > gitops/manifests/promoter/script.yaml"; exit 1; }
