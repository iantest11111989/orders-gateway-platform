# prod: promoted from staging by a pull request the owner approves. Every
# image change rolls out as a canary (Argo Rollouts): 10% -> 25% -> 50% ->
# 100% of traffic, with an SLO analysis after each step.
env: prod

image:
  tag: sha-76ee05c156cf
  digest: sha256:7c7dad1299f9397c944d1d6879fbb1a2ef0bd7de18a6cce8418d8e1c24570f24

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

route:
  hostname: orders.localtest.me

podDisruptionBudget:
  enabled: true

topologySpread:
  enabled: true

resources:
  requests: {cpu: 50m, memory: 32Mi}
  limits: {memory: 64Mi}

# A plain Deployment named app, as the contract requires: a Rollout would
# own the pods and leave the Deployment at 0 replicas. The canary demos
# turn the Rollout on in their copy of prod (scripts/demo.sh, decision 0020).
rollout:
  enabled: false
