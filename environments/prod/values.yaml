# prod: promoted from staging by a pull request the owner approves. Every
# image change rolls out as a canary (Argo Rollouts): 10% -> 25% -> 50% ->
# 100% of traffic, with an SLO analysis after each step.
env: prod

image:
  tag: sha-9ab553b08d9f
  digest: sha256:4a3e5f1af2371bd526a8eed0b4fcf23f86d7475cf26350d93e0e41af684f9735

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

route:
  hostname: orders.localtest.me

# http://localhost:8080 (the app's plain-HTTP endpoint).
publicRoute:
  enabled: true

podDisruptionBudget:
  enabled: true

topologySpread:
  enabled: true


# A plain Deployment named app, which the platform expects: a Rollout would
# own the pods and leave the Deployment at 0 replicas. The canary demos
# turn the Rollout on in their copy of prod (scripts/demo.sh).
rollout:
  enabled: false
