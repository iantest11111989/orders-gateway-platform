# prod: promoted from staging by a pull request the owner approves. Every
# image change rolls out as a canary (Argo Rollouts): 10% -> 25% -> 50% ->
# 100% of traffic, with an SLO analysis after each step.
env: prod

image:
  tag: sha-d5d3d8f966ab
  digest: sha256:4d29d22e316ab10b7f8c99f7963f1115ce27726afc5f4286e17cde01c221d572

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

route:
  hostname: orders.localtest.me

podDisruptionBudget:
  enabled: true

topologySpread:
  enabled: true

resources:
  requests: {cpu: 50m, memory: 32Mi}
  limits: {memory: 64Mi}

rollout:
  enabled: true
