{{- if .Values.rollout.enabled }}
# The Deployment stays the source of truth (image, probes, resources). This
# Rollout references it, scales it down to zero once its own pods are up, and
# runs the canary: traffic moves through the HTTPRoute weights in steps, with
# an SLO analysis after each, and an automatic rollback on failure.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "orders-gateway.name" . }}
  labels:
    {{- include "orders-gateway.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "orders-gateway.selectorLabels" . | nindent 6 }}
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "orders-gateway.name" . }}
    scaleDown: progressively
  strategy:
    canary:
      stableService: {{ include "orders-gateway.name" . }}-stable
      canaryService: {{ include "orders-gateway.name" . }}-canary
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: {{ include "orders-gateway.name" . }}
            namespace: {{ .Release.Namespace }}
      steps:
        {{- range .Values.rollout.steps }}
        {{- if hasKey . "analysis" }}
        - analysis:
            templates:
              - templateName: {{ include "orders-gateway.name" $ }}-slo
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        {{- else }}
        - {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- end }}
{{- end }}
