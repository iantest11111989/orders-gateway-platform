{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "orders-gateway.name" . }}
  labels:
    {{- include "orders-gateway.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway.name }}
      namespace: {{ .Values.route.gateway.namespace }}
      sectionName: {{ .Values.route.gateway.sectionName }}
  hostnames: [{{ .Values.route.hostname | quote }}]
  rules:
    - backendRefs:
        {{- if .Values.rollout.enabled }}
        # Argo Rollouts changes these weights during a canary (Argo CD
        # ignores the weights: gitops/apps/templates/orders-prod.yaml).
        - name: {{ include "orders-gateway.name" . }}-stable
          port: 80
          weight: 100
        - name: {{ include "orders-gateway.name" . }}-canary
          port: 80
          weight: 0
        {{- else }}
        - name: {{ include "orders-gateway.name" . }}
          port: 80
        {{- end }}
    {{- include "orders-gateway.adminDeny" . | nindent 4 }}
{{- end }}
