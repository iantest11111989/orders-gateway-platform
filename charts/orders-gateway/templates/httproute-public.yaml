{{- if .Values.publicRoute.enabled }}
# prod on http://localhost:8080 (the app's plain-HTTP endpoint):
# the Gateway's plain-HTTP listener on 8080, no hostname, everything the app
# serves except /admin/*.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "orders-gateway.name" . }}-public
  labels:
    {{- include "orders-gateway.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway.name }}
      namespace: {{ .Values.route.gateway.namespace }}
      sectionName: {{ .Values.publicRoute.sectionName }}
  rules:
    - backendRefs:
        - name: {{ include "orders-gateway.name" . }}
          port: 80
    {{- include "orders-gateway.adminDeny" . | nindent 4 }}
{{- end }}
