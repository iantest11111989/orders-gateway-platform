{{- if .Values.rollout.enabled }}
{{- $a := .Values.rollout.analysis }}
{{- $pod := printf "namespace=%q, rollouts_pod_template_hash=\"{{args.canary-hash}}\"" .Release.Namespace }}
{{- /* The two SLIs: availability on /work and /echo, latency on
     /echo and /version (/work's latency is chosen by the caller). */ -}}
{{- $sel := printf "%s, route=~\"/work|/echo\"" $pod }}
{{- $fast := printf "%s, route=~\"/echo|/version\"" $pod }}
{{- $data := "len(result) > 0 && !isNaN(result[0])" }}
# The SLO, measured on the canary pods only (ServiceMonitor podTargetLabels).
# Fails closed: a measurement with no data (no canary traffic yet) is neither
# a success nor a failure but Inconclusive, and more than inconclusiveLimit of
# those pauses the rollout for a human instead of promoting it.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "orders-gateway.name" . }}-slo
  labels:
    {{- include "orders-gateway.labels" . | nindent 4 }}
spec:
  args:
    - name: canary-hash
  metrics:
    - name: error-ratio
      initialDelay: {{ $a.initialDelay }}
      interval: {{ $a.interval }}
      count: {{ $a.count }}
      failureLimit: {{ $a.failureLimit }}
      inconclusiveLimit: {{ $a.inconclusiveLimit }}
      successCondition: {{ $data }} && result[0] <= {{ $a.maxErrorRatio }}
      failureCondition: {{ $data }} && result[0] > {{ $a.maxErrorRatio }}
      provider:
        prometheus:
          address: {{ $a.prometheusAddress }}
          # "or 0 * total": a canary with traffic but no 5xx gives 0, not
          # nothing, so an empty result really means no traffic.
          query: |
            (
              sum(rate(http_requests_total{ {{- $sel }}, status=~"5.."}[1m]))
              or
              0 * sum(rate(http_requests_total{ {{- $sel }}}[1m]))
            )
            /
            sum(rate(http_requests_total{ {{- $sel }}, status!~"4.."}[1m]))
    - name: p99-latency
      initialDelay: {{ $a.initialDelay }}
      interval: {{ $a.interval }}
      count: {{ $a.count }}
      failureLimit: {{ $a.failureLimit }}
      inconclusiveLimit: {{ $a.inconclusiveLimit }}
      successCondition: {{ $data }} && result[0] <= {{ $a.maxP99LatencySeconds }}
      failureCondition: {{ $data }} && result[0] > {{ $a.maxP99LatencySeconds }}
      provider:
        prometheus:
          address: {{ $a.prometheusAddress }}
          query: |
            histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{ {{- $fast }}}[1m])))
{{- end }}
