apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "orders-gateway.name" . }}
  labels:
    {{- include "orders-gateway.labels" . | nindent 4 }}
data:
  {{- with .Values.config.faultErrorRate }}
  FAULT_ERROR_RATE: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.faultLatencyMs }}
  FAULT_LATENCY_MS: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.startupDelayMs }}
  STARTUP_DELAY_MS: {{ . | quote }}
  {{- end }}
