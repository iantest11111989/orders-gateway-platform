{{- if .Values.serviceMonitor.enabled }}
# Scraped by Prometheus. The SLO recording rules and burn-rate alerts are
# cluster-wide, per namespace (alerts/orders-gateway-slo.yaml), so the chart
# ships no PrometheusRule of its own.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "orders-gateway.name" . }}
  labels:
    {{- include "orders-gateway.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "orders-gateway.selectorLabels" . | nindent 6 }}
    # Only the main Service. The -stable/-canary Services select the same
    # pods, and scraping through them too would count every request 3 times.
    matchExpressions:
      - {key: orders-gateway.platform/role, operator: DoesNotExist}
  # Canary analysis tells canary pods from stable ones by this label.
  podTargetLabels: [rollouts-pod-template-hash]
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
