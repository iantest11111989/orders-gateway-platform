# promtool unit tests for alerts/orders-gateway-slo.yaml.
# Run: scripts/test-alerts.sh (CI runs it on every pull request).
#
# Series use 1-minute samples. "0+600x90" means a counter that grows by 600
# a minute (10 requests/second) for 90 minutes.
rule_files:
  - ../../.build/alerts/orders-gateway-slo.rules.yaml

evaluation_interval: 30s

tests:
  # 9% of requests fail: about 18x the budget. Fast burn pages within minutes;
  # slow burn waits out its 15 m "for".
  - name: availability fast burn
    interval: 1m
    input_series:
      - series: 'http_requests_total{namespace="prod", route="/orders", method="POST", code="201"}'
        values: '0+600x90'
      - series: 'http_requests_total{namespace="prod", route="/orders", method="POST", code="502"}'
        values: '0+60x90'
    promql_expr_test:
      - expr: round(slo:orders_availability_errors:ratio_rate5m, 0.0001)
        eval_time: 10m
        exp_samples:
          - labels: '{namespace="prod"}'
            value: 0.0909
    alert_rule_test:
      - eval_time: 10m
        alertname: OrdersGatewayAvailabilityFastBurn
        exp_alerts:
          - exp_labels: {namespace: prod, severity: page, slo: orders-availability}
            exp_annotations:
              summary: "orders-gateway in prod is burning its availability error budget fast"
              description: "9.091% of POST /orders requests failed with 5xx over the last hour (the SLO allows 0.5%). At this rate the whole 30-day error budget is gone in about 2 days."
              runbook_url: https://github.com/iantest11111989/orders-gateway-platform/blob/main/runbooks/OrdersGatewayAvailabilityFastBurn.md
      - eval_time: 10m
        alertname: OrdersGatewayAvailabilitySlowBurn
        exp_alerts: []
      - eval_time: 30m
        alertname: OrdersGatewayAvailabilitySlowBurn
        exp_alerts:
          - exp_labels: {namespace: prod, severity: ticket, slo: orders-availability}
            exp_annotations:
              summary: "orders-gateway in prod is steadily burning its availability error budget"
              description: "9.091% of POST /orders requests failed with 5xx over the last 6 hours (the SLO allows 0.5%). At this rate the 30-day error budget is gone in about 5 days."
              runbook_url: https://github.com/iantest11111989/orders-gateway-platform/blob/main/runbooks/OrdersGatewayAvailabilitySlowBurn.md
      - eval_time: 30m
        alertname: OrdersGatewayLatencyFastBurn
        exp_alerts: []

  # 4.8% of valid requests fail: a slow burn, not a fast one. Many clients
  # also give up (499). If 499s counted as valid the ratio would drop to
  # 2.4% and no alert would fire, so this proves they are excluded.
  - name: availability slow burn, 499 excluded
    interval: 1m
    input_series:
      - series: 'http_requests_total{namespace="staging", route="/orders", method="POST", code="201"}'
        values: '0+600x90'
      - series: 'http_requests_total{namespace="staging", route="/orders", method="POST", code="499"}'
        values: '0+600x90'
      - series: 'http_requests_total{namespace="staging", route="/orders", method="POST", code="502"}'
        values: '0+30x90'
    promql_expr_test:
      - expr: round(slo:orders_availability_errors:ratio_rate30m, 0.0001)
        eval_time: 40m
        exp_samples:
          - labels: '{namespace="staging"}'
            value: 0.0476
    alert_rule_test:
      - eval_time: 40m
        alertname: OrdersGatewayAvailabilitySlowBurn
        exp_alerts:
          - exp_labels: {namespace: staging, severity: ticket, slo: orders-availability}
            exp_annotations:
              summary: "orders-gateway in staging is steadily burning its availability error budget"
              description: "4.762% of POST /orders requests failed with 5xx over the last 6 hours (the SLO allows 0.5%). At this rate the 30-day error budget is gone in about 5 days."
              runbook_url: https://github.com/iantest11111989/orders-gateway-platform/blob/main/runbooks/OrdersGatewayAvailabilitySlowBurn.md
      - eval_time: 40m
        alertname: OrdersGatewayAvailabilityFastBurn
        exp_alerts: []

  # 1 in 6 requests is slower than 300 ms: latency fast burn. No 5xx, so
  # availability stays quiet. Other routes are ignored.
  - name: latency fast burn
    interval: 1m
    input_series:
      - series: 'http_requests_total{namespace="prod", route="/orders", method="POST", code="201"}'
        values: '0+600x90'
      - series: 'http_request_duration_seconds_bucket{namespace="prod", route="/orders", method="POST", le="0.3"}'
        values: '0+500x90'
      - series: 'http_request_duration_seconds_bucket{namespace="prod", route="/orders", method="POST", le="+Inf"}'
        values: '0+600x90'
      - series: 'http_request_duration_seconds_count{namespace="prod", route="/orders", method="POST"}'
        values: '0+600x90'
      - series: 'http_request_duration_seconds_bucket{namespace="prod", route="/orders/{id}", method="GET", le="0.3"}'
        values: '0+0x90'
      - series: 'http_request_duration_seconds_count{namespace="prod", route="/orders/{id}", method="GET"}'
        values: '0+600x90'
    promql_expr_test:
      - expr: round(slo:orders_latency_errors:ratio_rate5m, 0.0001)
        eval_time: 10m
        exp_samples:
          - labels: '{namespace="prod"}'
            value: 0.1667
    alert_rule_test:
      - eval_time: 10m
        alertname: OrdersGatewayLatencyFastBurn
        exp_alerts:
          - exp_labels: {namespace: prod, severity: page, slo: orders-latency}
            exp_annotations:
              summary: "orders-gateway in prod is burning its latency error budget fast"
              description: "16.67% of POST /orders requests took longer than 300 ms over the last hour (the SLO allows 0.5%). At this rate the whole 30-day error budget is gone in about 2 days."
              runbook_url: https://github.com/iantest11111989/orders-gateway-platform/blob/main/runbooks/OrdersGatewayLatencyFastBurn.md
      - eval_time: 10m
        alertname: OrdersGatewayAvailabilityFastBurn
        exp_alerts: []

  # Healthy traffic in dev, plus a short blip of errors in prod that is over
  # before either long window notices. Nothing fires.
  - name: healthy and short blip
    interval: 1m
    input_series:
      - series: 'http_requests_total{namespace="dev", route="/orders", method="POST", code="201"}'
        values: '0+600x90'
      - series: 'http_request_duration_seconds_bucket{namespace="dev", route="/orders", method="POST", le="0.3"}'
        values: '0+600x90'
      - series: 'http_request_duration_seconds_count{namespace="dev", route="/orders", method="POST"}'
        values: '0+600x90'
      - series: 'http_requests_total{namespace="prod", route="/orders", method="POST", code="201"}'
        values: '0+600x90'
      # 2 minutes of 50% errors at minute 60-62, then none.
      - series: 'http_requests_total{namespace="prod", route="/orders", method="POST", code="502"}'
        values: '0x60 600 1200 1200x28'
    promql_expr_test:
      - expr: slo:orders_availability_errors:ratio_rate5m{namespace="dev"}
        eval_time: 30m
        exp_samples:
          - labels: 'slo:orders_availability_errors:ratio_rate5m{namespace="dev"}'
            value: 0
    alert_rule_test:
      - eval_time: 30m
        alertname: OrdersGatewayAvailabilityFastBurn
        exp_alerts: []
      - eval_time: 30m
        alertname: OrdersGatewayLatencyFastBurn
        exp_alerts: []
      - eval_time: 80m
        alertname: OrdersGatewayAvailabilityFastBurn
        exp_alerts: []
      - eval_time: 80m
        alertname: OrdersGatewayAvailabilitySlowBurn
        exp_alerts: []
