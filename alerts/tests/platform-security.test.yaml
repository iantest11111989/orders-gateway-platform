# promtool unit tests for alerts/platform-security.yaml.
# Run: scripts/test-alerts.sh (CI runs it on every pull request).
rule_files:
  - ../../.build/alerts/platform-security.rules.yaml

evaluation_interval: 30s

tests:
  # Kyverno stops answering scrapes at minute 10; it pages 5 minutes later.
  - name: Kyverno down
    interval: 1m
    input_series:
      - series: 'up{job="kyverno-svc-metrics", pod="kyverno-a"}'
        values: '1x10 0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: KyvernoDown
        exp_alerts: []
      - eval_time: 14m
        alertname: KyvernoDown
        exp_alerts: []
      - eval_time: 16m
        alertname: KyvernoDown
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: "Kyverno's admission controller is down: pods are admitted without policy checks"
              description: "No Kyverno admission controller has answered a metrics scrape for 5 minutes. Its webhooks fail open (failurePolicy: Ignore), so new pods, including in the app namespaces, skip the tag and signature policies until it's back."
              runbook_url: https://github.com/iantest11111989/orders-gateway-platform/blob/main/runbooks/KyvernoDown.md

  # The scrape target disappearing entirely (pod deleted) counts as down too.
  - name: Kyverno target gone
    interval: 1m
    input_series:
      - series: 'up{job="something-else"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: KyvernoDown
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: "Kyverno's admission controller is down: pods are admitted without policy checks"
              description: "No Kyverno admission controller has answered a metrics scrape for 5 minutes. Its webhooks fail open (failurePolicy: Ignore), so new pods, including in the app namespaces, skip the tag and signature policies until it's back."
              runbook_url: https://github.com/iantest11111989/orders-gateway-platform/blob/main/runbooks/KyvernoDown.md

  # Passes and failures are normal; errors aren't. Both metric names count.
  - name: Kyverno policy errors
    interval: 1m
    input_series:
      - series: 'kyverno_validating_policy_results_total{policy_name="disallow-latest-tag", result="pass"}'
        values: '0+5x30'
      - series: 'kyverno_validating_policy_results_total{policy_name="disallow-latest-tag", result="fail"}'
        values: '0+1x30'
      - series: 'kyverno_image_validating_policy_results_total{policy_name="verify-image-signatures", result="error"}'
        values: '0x10 1+1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: KyvernoPolicyErrors
        exp_alerts: []
      - eval_time: 20m
        alertname: KyvernoPolicyErrors
        exp_alerts:
          - exp_labels: {severity: ticket, policy_name: verify-image-signatures}
            exp_annotations:
              summary: "Kyverno policy verify-image-signatures is returning errors"
              description: "10 evaluations of verify-image-signatures ended in an error in the last 15 minutes. An erroring policy neither admits nor refuses on its merits."
              runbook_url: https://github.com/iantest11111989/orders-gateway-platform/blob/main/runbooks/KyvernoPolicyErrors.md

  - name: Sealed Secrets
    interval: 1m
    input_series:
      - series: 'up{job="sealed-secrets-controller-metrics"}'
        values: '1x30'
      - series: 'sealed_secrets_controller_condition_info{condition="Synced", namespace="monitoring", name="grafana-admin"}'
        values: '1x30'
      - series: 'sealed_secrets_controller_condition_info{condition="Synced", namespace="prod", name="payments-key"}'
        values: '1x10 0x20'
    alert_rule_test:
      - eval_time: 30m
        alertname: SealedSecretsControllerDown
        exp_alerts: []
      - eval_time: 30m
        alertname: SealedSecretUnsealFailed
        exp_alerts:
          - exp_labels: {severity: ticket, condition: Synced, namespace: prod, name: payments-key}
            exp_annotations:
              summary: "SealedSecret prod/payments-key can't be unsealed"
              description: "The controller couldn't turn SealedSecret prod/payments-key into a Secret. Anything that reads that Secret has the old value, or none."
              runbook_url: https://github.com/iantest11111989/orders-gateway-platform/blob/main/runbooks/SealedSecretUnsealFailed.md

  # Criticals in a platform namespace don't count; in the app namespaces they do.
  - name: Trivy
    interval: 1m
    input_series:
      - series: 'up{job="trivy-operator"}'
        values: '1x60'
      - series: 'trivy_image_vulnerabilities{namespace="kube-system", image_repository="kindest/kindnetd", image_tag="v1", severity="Critical"}'
        values: '2x60'
      - series: 'trivy_image_vulnerabilities{namespace="prod", image_repository="iantest11111989/orders-gateway", image_digest="sha256:abc", severity="Critical", resource_name="a"}'
        values: '0x10 1x50'
      - series: 'trivy_image_vulnerabilities{namespace="prod", image_repository="iantest11111989/orders-gateway", image_digest="sha256:abc", severity="High", resource_name="a"}'
        values: '3x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: OrdersImageCriticalVulnerability
        exp_alerts: []
      - eval_time: 45m
        alertname: OrdersImageCriticalVulnerability
        exp_alerts:
          - exp_labels: {severity: ticket, namespace: prod, image_repository: iantest11111989/orders-gateway, image_digest: "sha256:abc"}
            exp_annotations:
              summary: "prod runs an image with critical vulnerabilities"
              description: "Trivy Operator found 1 critical vulnerabilities in iantest11111989/orders-gateway@sha256:abc, running in prod."
              runbook_url: https://github.com/iantest11111989/orders-gateway-platform/blob/main/runbooks/OrdersImageCriticalVulnerability.md
      - eval_time: 45m
        alertname: TrivyOperatorDown
        exp_alerts: []
