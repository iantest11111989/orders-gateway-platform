# The app image must carry a keyless cosign signature from this repo's app
# workflow on main, so only reviewed code can run. Enforced (Deny).
# Other images (third-party charts) aren't matched.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Verify app image signatures
    policies.kyverno.io/description: >-
      ghcr.io/iantest11111989/orders-gateway images must be signed by the
      app workflow on main (keyless cosign, GitHub OIDC).
spec:
  validationActions: [Deny]
  # One Kyverno replica: a Kyverno outage must not block every orders pod.
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: false
  webhookConfiguration:
    # Verification fetches the signature from GHCR and Sigstore's trust root.
    timeoutSeconds: 15
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchImageReferences:
    - glob: ghcr.io/iantest11111989/orders-gateway*
  validationConfigurations:
    # The environments already deploy by digest, so there's no tag to pin.
    mutateDigest: false
    verifyDigest: false
    required: false
  attestors:
    - name: cosign
      cosign:
        keyless:
          # The images on GHCR were signed by the repo's former CD workflow
          # (cd-app.yml, earlier app.yml) on main. CI/CD is local now
          # (./pipeline builds unsigned localhost/ images, which this policy
          # doesn't match); production signs in CI the same way
          # (docs/ci-cd-in-production.md). One identity matching both names.
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/iantest11111989/orders-gateway-platform/\.github/workflows/(cd-app|app)\.yml@refs/heads/main$
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.cosign])).all(e, e > 0)
      message: >-
        The orders-gateway image must be signed by the app's CD workflow on main.
