# A pod with no app/env/team labels in orders-staging: standard-labels adds them.
apiVersion: v1
kind: Pod
metadata:
  name: unlabelled
  namespace: orders-staging
  labels:
    app.kubernetes.io/name: orders-gateway
spec:
  containers:
    - name: app
      image: ghcr.io/iantest11111989/orders-gateway:v1
