# Outside the app namespaces: the label rules don't apply.
apiVersion: v1
kind: Pod
metadata:
  name: platform-no-labels
  namespace: monitoring
spec:
  securityContext: {runAsNonRoot: true}
  containers:
    - name: app
      image: quay.io/prometheus/prometheus:v3.16.0
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 32Mi}}
      securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: good-deploy
  namespace: dev
spec:
  selector: {matchLabels: {app: d}}
  template:
    metadata: {labels: {app: d}}
    spec:
      containers:
        - name: app
          image: ghcr.io/iantest11111989/orders-gateway:v1
          livenessProbe: {httpGet: {path: /healthz, port: 8080}}
          readinessProbe: {httpGet: {path: /readyz, port: 8080}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-no-probes
  namespace: dev
spec:
  selector: {matchLabels: {app: d}}
  template:
    metadata: {labels: {app: d}}
    spec:
      containers:
        - name: app
          image: ghcr.io/iantest11111989/orders-gateway:v1
          readinessProbe: {httpGet: {path: /readyz, port: 8080}}
---
# A :latest image outside the app namespaces: disallow-latest-tag-platform reports it
# (Audit), disallow-latest-tag (Deny, app namespaces only) skips it.
apiVersion: v1
kind: Pod
metadata:
  name: platform-latest
  namespace: monitoring
spec:
  securityContext: {runAsNonRoot: true}
  containers:
    - name: app
      image: quay.io/prometheus/prometheus:latest
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 32Mi}}
      securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
