# `kyverno test policies/tests` (CI: .github/workflows/policies.yml).
# Every policy is checked against compliant resources and ones that break it.
# Audit and Deny policies both report "fail" here.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: platform-policies
policies:
  - ../disallow-latest-tag.yaml
  - ../disallow-latest-tag-platform.yaml
  - ../require-resources.yaml
  - ../require-probes.yaml
  - ../require-non-root-readonly.yaml
  - ../restrict-image-registries.yaml
  - ../standard-labels.yaml
  - ../verify-image-signatures.yaml
resources:
  - resources.yaml
  - mutate-resource.yaml
  - signature-resources.yaml
results:
  - policy: disallow-latest-tag
    resources: [good-pod, bad-registry, bad-root]
    kind: Pod
    result: pass
  - policy: disallow-latest-tag
    resources: [bad-untagged, bad-untagged-port, bad-latest]
    kind: Pod
    result: fail
  - policy: disallow-latest-tag
    resources: [platform-latest, platform-no-labels]
    kind: Pod
    result: skip

  - policy: disallow-latest-tag-platform
    resources: [platform-no-labels]
    kind: Pod
    result: pass
  - policy: disallow-latest-tag-platform
    resources: [platform-latest]
    kind: Pod
    result: fail
  - policy: disallow-latest-tag-platform
    resources: [good-pod, bad-latest]
    kind: Pod
    result: skip

  - policy: require-resources
    resources: [good-pod, bad-latest]
    kind: Pod
    result: pass
  - policy: require-resources
    resources: [bad-no-limits]
    kind: Pod
    result: fail

  - policy: require-probes
    resources: [good-deploy]
    kind: Deployment
    result: pass
  - policy: require-probes
    resources: [bad-no-probes]
    kind: Deployment
    result: fail

  - policy: require-non-root-readonly
    resources: [good-pod, bad-latest]
    kind: Pod
    result: pass
  - policy: require-non-root-readonly
    resources: [bad-root, bad-writable]
    kind: Pod
    result: fail

  - policy: restrict-image-registries
    resources: [good-pod, platform-no-labels, local-build]
    kind: Pod
    result: pass
  - policy: restrict-image-registries
    resources: [bad-registry, bad-bare-name, bad-untagged-port, bad-local-other]
    kind: Pod
    result: fail

  - policy: require-standard-labels
    resources: [good-pod]
    kind: Pod
    result: pass
  - policy: require-standard-labels
    resources: [bad-no-labels]
    kind: Pod
    result: fail
  - policy: require-standard-labels
    resources: [platform-no-labels]
    kind: Pod
    result: skip

  - policy: default-labels
    resources: [unlabelled]
    kind: Pod
    patchedResources: mutate-patched.yaml
    result: pass

  # Needs network: it fetches real signatures from GHCR and Sigstore's trust
  # root. signed-app is a digest that main's `sign` job signed (#19);
  # unsigned-app is the digest published before signing existed.
  - policy: verify-image-signatures
    resources: [signed-app, other-image]
    kind: Pod
    result: pass
  - policy: verify-image-signatures
    resources: [unsigned-app]
    kind: Pod
    result: fail
