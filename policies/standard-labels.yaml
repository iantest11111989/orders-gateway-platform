# app, env and team labels on pods in the app namespaces: Kyverno adds
# defaults where missing, then audits. Pods only, never Deployments, so Argo
# CD sees no drift.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: default-labels
  annotations:
    policies.kyverno.io/title: Default app, env and team labels
    policies.kyverno.io/description: >-
      Adds app, env and team labels to pods in the app namespaces when
      they're missing. Existing labels are never changed.
spec:
  # A Kyverno outage must not block pod creation.
  failurePolicy: Ignore
  evaluation:
    mutateExisting:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  matchConditions:
    - name: app-namespaces
      expression: "request.namespace in ['dev', 'staging', 'prod', 'demo']"
  variables:
    - name: labels
      expression: 'has(object.metadata.labels) ? object.metadata.labels : {}'
    - name: name
      expression: >-
        'app.kubernetes.io/name' in variables.labels ? variables.labels['app.kubernetes.io/name'] : ''
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          (has(object.metadata.labels) ? [] : [JSONPatch{op: 'add', path: '/metadata/labels', value: {}}])
          + ('team' in variables.labels ? [] : [JSONPatch{op: 'add', path: '/metadata/labels/team', value: 'orders'}])
          + ('env' in variables.labels ? [] : [JSONPatch{op: 'add', path: '/metadata/labels/env', value: request.namespace}])
          + ('app' in variables.labels || variables.name == '' ? [] : [JSONPatch{op: 'add', path: '/metadata/labels/app', value: variables.name}])
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-standard-labels
  annotations:
    policies.kyverno.io/title: Require app, env and team labels
    policies.kyverno.io/description: >-
      Pods in the app namespaces must carry app, env and team labels
      (after default-labels has added what it can).
spec:
  validationActions: [Audit]
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: app-namespaces
      expression: "request.namespace in ['dev', 'staging', 'prod', 'demo']"
  validations:
    - expression: >-
        has(object.metadata.labels) && ['app', 'env', 'team'].all(l, l in object.metadata.labels && object.metadata.labels[l] != '')
      messageExpression: >-
        'Pods in the app namespaces need app, env and team labels; missing: ' +
        ['app', 'env', 'team'].filter(l, !(has(object.metadata.labels) && l in object.metadata.labels && object.metadata.labels[l] != '')).join(', ')
