# Alloy DaemonSet shipping pod logs to Loki. It tails its node's pods through
# the API (loki.source.kubernetes): no host paths, runs as non-root.
# Loki labels are kept to namespace, app, env and pod; parse the rest with `| json`.

alloy:
  configMap:
    create: true
    content: |
      // Pods on this node only (NODE_NAME comes from the downward API).
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        // Skip pods that haven't started (no container yet).
        rule {
          source_labels = ["__meta_kubernetes_pod_phase"]
          regex         = "Pending|Succeeded|Failed|Unknown"
          action        = "drop"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        // app: the first label that is set, in this order.
        rule {
          source_labels = [
            "__meta_kubernetes_pod_label_app_kubernetes_io_name",
            "__meta_kubernetes_pod_label_app",
            "__meta_kubernetes_pod_label_k8s_app",
            "__meta_kubernetes_pod_label_component",
          ]
          separator    = ";"
          regex        = ";*([^;]+).*"
          target_label = "app"
        }
        // env: the pod's env label, or "platform" for platform components.
        rule {
          source_labels = ["__meta_kubernetes_pod_label_env"]
          regex         = ""
          replacement   = "platform"
          target_label  = "env"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_env"]
          regex         = "(.+)"
          target_label  = "env"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.labels.receiver]
      }

      // loki.source.kubernetes adds instance (namespace/pod:container) and
      // job after relabeling; drop them so only namespace/app/env/pod remain.
      // The container name moves to structured metadata first, so lines from
      // multi-container pods can still be told apart ({...} | container="x").
      loki.process "labels" {
        stage.regex {
          source     = "instance"
          expression = "^[^/]+/[^:]+:(?P<container>.+)$"
        }
        stage.structured_metadata {
          values = {container = ""}
        }
        stage.label_drop {
          values = ["instance", "job"]
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.logging.svc:3100/loki/api/v1/push"
        }
      }

      // Alloy's own logs as JSON, so they parse in Loki like everything else.
      logging {
        level  = "info"
        format = "json"
      }

  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName

  mounts:
    varlog: false
    dockercontainers: false
    extra:
      - name: storage
        mountPath: /tmp/alloy

  storagePath: /tmp/alloy
  resources:
    requests: {cpu: 20m, memory: 96Mi}
    limits: {memory: 192Mi}
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: {drop: [ALL]}
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile: {type: RuntimeDefault}

configReloader:
  resources:
    requests: {cpu: 5m, memory: 16Mi}
    limits: {memory: 32Mi}

controller:
  type: daemonset
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile: {type: RuntimeDefault}
  # Also on the control plane, for etcd, API server and scheduler logs.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  # Positions and WAL (root FS is read-only).
  volumes:
    extra:
      - name: storage
        emptyDir: {sizeLimit: 256Mi}

# The chart's default role can read every Secret and ConfigMap; tailing needs less.
rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods", "pods/log", "namespaces"]
      verbs: ["get", "list", "watch"]

serviceMonitor:
  enabled: true
