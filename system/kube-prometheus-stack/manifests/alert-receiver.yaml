# The local alert receiver: Alertmanager posts every
# notification here, and it writes each alert as one JSON line to stdout.
# Alloy ships that to Loki, so alerts are searchable next to the logs:
#   {namespace="monitoring", app="alert-receiver"} | json | route="page"
# Production would point the page and ticket receivers at an on-call tool
# and a chat channel instead (README, "Local vs a real cloud").
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-receiver
  namespace: monitoring
data:
  receiver.py: |
    import json, sys, time
    from http.server import BaseHTTPRequestHandler, HTTPServer

    LEVEL = {"page": "ERROR", "ticket": "WARN"}

    def log(**fields):
        print(json.dumps({"time": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), **fields}), flush=True)

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):  # probes
            self.send_response(200 if self.path == "/healthz" else 404)
            self.end_headers()

        def do_POST(self):
            route = self.path.strip("/") or "log"
            try:
                body = json.loads(self.rfile.read(int(self.headers.get("Content-Length", 0))))
            except ValueError:
                self.send_response(400)
                self.end_headers()
                return
            for a in body.get("alerts", []):
                labels, ann = a.get("labels", {}), a.get("annotations", {})
                firing = a.get("status") == "firing"
                log(level=LEVEL.get(route, "INFO") if firing else "INFO", msg="alert", route=route,
                    status=a.get("status"), alertname=labels.get("alertname"), severity=labels.get("severity"),
                    alert_namespace=labels.get("namespace"), summary=ann.get("summary"),
                    runbook_url=ann.get("runbook_url"), starts_at=a.get("startsAt"))
            self.send_response(200)
            self.end_headers()

        def log_message(self, *args):  # no access log: one line per alert is enough
            pass

    log(level="INFO", msg="alert-receiver listening on :8080")
    HTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-receiver
  namespace: monitoring
  labels: {app.kubernetes.io/name: alert-receiver, app.kubernetes.io/part-of: orders-gateway-platform}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: alert-receiver}
  template:
    metadata:
      labels: {app.kubernetes.io/name: alert-receiver, app: alert-receiver}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: receiver
          image: docker.io/library/python:3.14-alpine@sha256:5862d971d1f0ae26b258cefa4e893556b1d3aba81bd2ff30888704ad378bab67
          command: [python, -u, /app/receiver.py]
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 48Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: app, mountPath: /app, readOnly: true}
      volumes:
        - name: app
          configMap: {name: alert-receiver}
---
apiVersion: v1
kind: Service
metadata:
  name: alert-receiver
  namespace: monitoring
  labels: {app.kubernetes.io/name: alert-receiver}
spec:
  selector: {app.kubernetes.io/name: alert-receiver}
  ports:
    - {name: http, port: 8080, targetPort: http}
