# Argo CD's repo-server reads charts; the nodes pull images (NodePort
# traffic arrives from outside the pod range 10.244.0.0/16). Pushes come
# through `kubectl port-forward` (scripts/registry.sh), which the kubelet
# forwards to the pod directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: registry
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: registry}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: argocd}
          podSelector:
            matchLabels: {app.kubernetes.io/name: argocd-repo-server}
        - ipBlock: {cidr: 0.0.0.0/0, except: [10.244.0.0/16]}
      ports:
        - {port: 5000, protocol: TCP}
