apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  labels: {app.kubernetes.io/name: registry}
spec:
  replicas: 1
  # One writer on a ReadWriteOnce volume: stop the old pod first.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: registry}
  template:
    metadata:
      labels: {app.kubernetes.io/name: registry}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: registry
          # CNCF Distribution 3.0.0; Renovate keeps it current (kubernetes manager).
          image: docker.io/library/registry:3.0.0@sha256:6c5666b861f3505b116bb9aa9b25175e71210414bd010d92035ff64018f9457e
          env:
            - {name: REGISTRY_HTTP_ADDR, value: ":5000"}
            - {name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY, value: /var/lib/registry}
            # Nothing is ever deleted: a published version stays what it was.
            - {name: REGISTRY_STORAGE_DELETE_ENABLED, value: "false"}
            - {name: OTEL_TRACES_EXPORTER, value: none}
          ports:
            - {name: http, containerPort: 5000}
          startupProbe:
            httpGet: {path: /v2/, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /v2/, port: http}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /v2/, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/registry}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: registry}
        - name: tmp
          emptyDir: {}
