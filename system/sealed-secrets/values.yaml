# Sealed Secrets chart values (bootstrap/apps/templates/sealed-secrets.yaml).

# kubeseal's defaults (controller name and namespace), so it needs no flags.
fullnameOverride: sealed-secrets-controller

# Keep using the committed demo key: no automatic key renewal (default 30
# days), which would start sealing with a new key that isn't in Git.
keyrenewperiod: "0"

resources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {memory: 128Mi}

metrics:
  serviceMonitor:
    enabled: true
