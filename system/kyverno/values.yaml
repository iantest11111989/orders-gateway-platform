# Kyverno: admission controller only. Background scans, cleanup and reports
# are off to save memory; audit results still appear as metrics and events.
backgroundController:
  enabled: false
cleanupController:
  enabled: false
reportsController:
  enabled: false
features:
  admissionReports:
    enabled: false
  aggregateReports:
    enabled: false
  policyReports:
    enabled: false
  validatingAdmissionPolicyReports:
    enabled: false

# Only CEL policies here: skip the legacy-policy check (a hook Job on every sync).
upgrade:
  acknowledgeLegacyPoliciesNotEnforced: true

admissionController:
  replicas: 1
  container:
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 384Mi}
  serviceMonitor:
    enabled: true

config:
  webhooks:
    # Never kube-system (the chart's default) or Kyverno's own namespace.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system]
