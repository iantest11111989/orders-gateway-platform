# kind cluster for orders-gateway-platform: 1 control plane + 2 workers.
# Created by `./platform up`; see docs/decisions/0004-toolbox-and-cluster.md.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ogp
networking:
  # API server only on loopback; the toolbox shares the host network.
  apiServerAddress: 127.0.0.1
  # kindnet enforces NetworkPolicy (kind >= v0.24), so no extra CNI is needed.
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      topology.kubernetes.io/zone: zone-a
    # Host 80/443 -> NodePorts 30080/30443, where the Envoy Gateway service
    # listens. Bound to 127.0.0.1 so the stack is not exposed to the LAN.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        listenAddress: 127.0.0.1
        protocol: TCP
    kubeadmConfigPatches:
      # Expose control-plane metrics on all interfaces so Prometheus can
      # scrape them from inside the cluster.
      - |
        kind: ClusterConfiguration
        controllerManager:
          extraArgs:
            - name: bind-address
              value: 0.0.0.0
        scheduler:
          extraArgs:
            - name: bind-address
              value: 0.0.0.0
        etcd:
          local:
            extraArgs:
              - name: listen-metrics-urls
                value: http://0.0.0.0:2381
      - |
        kind: KubeProxyConfiguration
        metricsBindAddress: 0.0.0.0:10249
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      topology.kubernetes.io/zone: zone-a
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      topology.kubernetes.io/zone: zone-b
