# kind cluster for orders-gateway-platform: 1 control plane + 2 workers.
# Created by `./platform up`.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ogp
networking:
  # API server only on loopback; the toolbox shares the host network.
  apiServerAddress: 127.0.0.1
  # kindnet enforces NetworkPolicy (kind >= v0.24), so no extra CNI is needed.
  # kind's default pod range, set explicitly: the NetworkPolicies in
  # system/network-policies/ treat everything outside it as "the
  # nodes". Keep the two in step; changing it needs a new cluster.
  podSubnet: 10.244.0.0/16
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      topology.kubernetes.io/zone: zone-a
    # Host ports -> Traefik's NodePorts (system/traefik/values.yaml), plain
    # HTTP, bound to 127.0.0.1 so the stack is not exposed to the LAN:
    # 8080 prod, 8082 dev, 8083 staging, 8084 demo, 8081 Argo CD,
    # 3000 Grafana, 9090 Prometheus, 9093 Alertmanager.
    # Changing these needs a new cluster (./platform down && ./platform up).
    extraPortMappings:
      - {containerPort: 30808, hostPort: 8080, listenAddress: 127.0.0.1, protocol: TCP}
      - {containerPort: 30882, hostPort: 8082, listenAddress: 127.0.0.1, protocol: TCP}
      - {containerPort: 30883, hostPort: 8083, listenAddress: 127.0.0.1, protocol: TCP}
      - {containerPort: 30884, hostPort: 8084, listenAddress: 127.0.0.1, protocol: TCP}
      - {containerPort: 30881, hostPort: 8081, listenAddress: 127.0.0.1, protocol: TCP}
      - {containerPort: 30300, hostPort: 3000, listenAddress: 127.0.0.1, protocol: TCP}
      - {containerPort: 30909, hostPort: 9090, listenAddress: 127.0.0.1, protocol: TCP}
      - {containerPort: 30993, hostPort: 9093, listenAddress: 127.0.0.1, protocol: TCP}
    kubeadmConfigPatches:
      # Expose control-plane metrics on all interfaces so Prometheus can
      # scrape them from inside the cluster.
      - |
        kind: ClusterConfiguration
        controllerManager:
          extraArgs:
            - name: bind-address
              value: 0.0.0.0
        scheduler:
          extraArgs:
            - name: bind-address
              value: 0.0.0.0
        etcd:
          local:
            extraArgs:
              - name: listen-metrics-urls
                value: http://0.0.0.0:2381
      - |
        kind: KubeProxyConfiguration
        metricsBindAddress: 0.0.0.0:10249
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      topology.kubernetes.io/zone: zone-a
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      topology.kubernetes.io/zone: zone-b
