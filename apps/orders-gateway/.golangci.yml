version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
    - unconvert
  exclusions:
    rules:
      # Tests drive a local server directly; request contexts add nothing there.
      - path: _test\.go
        linters: [noctx]
formatters:
  enable:
    - gofmt
    - goimports
