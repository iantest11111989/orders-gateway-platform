# staging: promoted from dev with ./pipeline cd.
env: staging

# false: changes wait for a Sync click (or ./pipeline cd --sync).
autoSync: false

# Set by ./pipeline cd: image and chart <version> from the in-stack registry.
version: 0.1.0

image:
  tag: 0.1.0
  digest: ""

# Same autoscaling as prod, so a release is tested the way prod runs it.
# A lower ceiling than prod's 6 keeps it inside the 6 CPU budget.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

ingress:
  entrypoint: staging
