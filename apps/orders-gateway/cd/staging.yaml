# staging: promoted from dev with ./pipeline cd.
env: staging

# false: changes wait for a Sync click (or ./pipeline cd --sync).
autoSync: false

# Set by ./pipeline cd: image and chart <version> from the in-stack registry.
version: 0.1.0

image:
  tag: 0.1.0
  digest: ""

replicas: 2

ingress:
  entrypoint: staging
