# Baseline for logging: deny ingress except from its own pods and the nodes.
# On kindnet a deny-all would also drop the control plane's traffic to pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: logging
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: logging
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-nodes
  namespace: logging
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        # Outside the pod network: the nodes and the API server.
        - ipBlock: {cidr: 0.0.0.0/0, except: [10.244.0.0/16]}
---
# Grafana queries Loki; Prometheus scrapes Loki and Alloy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring
  namespace: logging
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - {port: 3100, protocol: TCP}
        - {port: 12345, protocol: TCP}
