# Argo CD values: used by ./platform up for the first install and by
# stack/delivery/bootstrap/apps once Argo CD manages itself. Edit only here.

global:
  domain: localhost:8081

# Trimmed for the 6 CPU / 12 GB budget.
dex:
  enabled: false
notifications:
  enabled: false
redis-ha:
  enabled: false

configs:
  # admin / admin12345 (bcrypt), the shared demo login. Not a SealedSecret:
  # Argo CD installs before the Sealed Secrets controller exists.
  # Regenerate: argocd account bcrypt --password <new>, and bump the mtime.
  secret:
    argocdServerAdminPassword: "$2a$10$XEl/Kynful4ORRtkDtt9H.n7GglQet9YoTAnqiQNHj3Jxq7BgDimG"
    argocdServerAdminPasswordMtime: "2026-11-25T23:00:00Z"
  # The in-stack OCI registry for charts ./pipeline publishes (plain HTTP).
  repositories:
    registry:
      name: registry
      type: helm
      url: registry.registry.svc.cluster.local:5000/charts
      enableOCI: "true"
      insecureOCIForceHttp: "true"
  params:
    server.insecure: true
    # JSON logs, so Loki can parse them with `| json`.
    controller.log.format: json
    server.log.format: json
    reposerver.log.format: json
    applicationsetcontroller.log.format: json
    commitserver.log.format: json
  cm:
    # The chart would default to https://<domain>.
    url: http://localhost:8081
    # Poll Git every 3 min to save CPU (read from argocd-cm, not cmd-params-cm).
    timeout.reconciliation: 180s
    exec.enabled: false
    admin.enabled: true
    statusbadge.enabled: false
    # CRD health without waiting for "Established": Argo CD tracks no CRD
    # annotation, so an app could sit Progressing until the next resync and
    # hold back later sync waves. Failure cases match the built-in check.
    # The Application health check (removed in Argo CD 1.8) makes sync waves
    # in the app-of-apps wait for each child to be Healthy.
    resource.customizations.health.apiextensions.k8s.io_CustomResourceDefinition: |
      hs = {status = "Healthy", message = "CRD accepted"}
      if obj.metadata.deletionTimestamp ~= nil then
        hs.status = "Progressing"
        hs.message = "CRD is terminating"
        return hs
      end
      if obj.status == nil or obj.status.conditions == nil then
        return hs
      end
      for _, c in pairs(obj.status.conditions) do
        if c.type == "NamesAccepted" and c.status == "False" then
          hs.status = "Degraded"
          hs.message = "CRD names have not been accepted: " .. (c.message or "")
          return hs
        end
        if c.type == "NonStructuralSchema" and c.status == "True" then
          hs.status = "Degraded"
          hs.message = "Schema violations found: " .. (c.message or "")
          return hs
        end
        if c.type == "Established" and c.status == "False" and c.reason == "InvalidCABundle" then
          hs.status = "Degraded"
          hs.message = "CRD is not established: " .. (c.message or "")
          return hs
        end
      end
      return hs
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
        -- A new child app that hasn't synced yet has no resources and
        -- reports Healthy, so the next sync wave would start before this one
        -- exists (CI on #31: wave 25 started 26 s after wave 20 appeared,
        -- before monitoring existed). Hold it until it has synced once. An
        -- app whose resources already match Git is Synced without ever
        -- running a sync (no history), so that one passes.
        local synced = obj.status.sync ~= nil and obj.status.sync.status == "Synced"
        local never = obj.status.history == nil or #obj.status.history == 0
        if never and not synced then
          hs.status = "Progressing"
          hs.message = "waiting for the first sync"
        end
      end
      return hs
  rbac:
    policy.default: role:readonly

controller:
  resources:
    # The first sync fills the cluster cache at once: peaks reached ~856Mi
    # (OOMKilled at 512Mi and 1Gi) against ~275Mi steady. A high request avoids
    # eviction under memory pressure, which loses sync progress like an OOM.
    requests: {cpu: 100m, memory: 768Mi}
    limits: {memory: 1536Mi}
  # Soft limit (~80% of the hard limit): GC slows a spike down instead of an OOM kill.
  env:
    - name: GOMEMLIMIT
      value: 1200MiB
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

server:
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

repoServer:
  resources:
    # A fresh bootstrap renders every chart at once; OOMKilled at 512Mi. Steady ~120Mi.
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 1Gi}
  # Soft limit (~80% of the hard limit), as for the controller.
  env:
    - name: GOMEMLIMIT
      value: 800MiB
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

applicationSet:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

redis:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
  metrics:
    enabled: false
