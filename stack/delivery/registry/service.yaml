# Two ways in: the ClusterIP for Argo CD's repo-server (charts), and NodePort
# 30500 so each node's containerd pulls localhost:30500/<app> over plain HTTP
# (allowed for localhost): no registry config on the nodes.
apiVersion: v1
kind: Service
metadata:
  name: registry
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: registry}
  ports:
    - {name: http, port: 5000, targetPort: http, nodePort: 30500}
