# Argo CD reads charts; nodes pull images (NodePort traffic from outside the
# pod range). Port-forwarded pushes bypass NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: registry
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: registry}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: argocd}
          podSelector:
            matchLabels: {app.kubernetes.io/name: argocd-repo-server}
        - ipBlock: {cidr: 0.0.0.0/0, except: [10.244.0.0/16]}
      ports:
        - {port: 5000, protocol: TCP}
