# The in-stack Git server (soft-serve) Argo CD syncs from. Applied by
# scripts/git-sync.sh before Argo CD exists.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: git
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: platform-demo
    includeSelectors: false
