# Only Argo CD reads (HTTP). Port-forwarded pushes bypass NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: soft-serve
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: soft-serve}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: argocd}
      ports:
        - {port: 23232, protocol: TCP}
