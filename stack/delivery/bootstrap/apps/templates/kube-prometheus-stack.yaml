# Prometheus, Alertmanager, Grafana and exporters (values in stack/).
# Pod Security "privileged" only for node-exporter (host network, PID, FS);
# every other pod here is restricted-compliant.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform-demo
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/manifest-generate-paths: "/stack/observability/prometheus"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 93.6.1 # operator v0.95.2, same as prometheus-operator-crds
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/stack/observability/prometheus/values.yaml
    - repoURL: {{ .Values.repo.url }}
      targetRevision: {{ .Values.repo.revision }}
      ref: values
    # SealedSecrets (Grafana's admin login).
    - repoURL: {{ .Values.repo.url }}
      targetRevision: {{ .Values.repo.revision }}
      path: stack/observability/prometheus/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Auto-sync doesn't retry a failed sync of the same revision on its own.
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/warn: baseline
        pod-security.kubernetes.io/audit: restricted
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
