# Ingresses for the platform UIs, one Traefik entrypoint each (stack/networking/edge/).
# Wave 25: after Traefik and the `monitoring` namespace exist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edge
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform-demo
  annotations:
    argocd.argoproj.io/sync-wave: "25"
    argocd.argoproj.io/manifest-generate-paths: "/stack/networking/edge"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: {{ .Values.repo.url }}
    targetRevision: {{ .Values.repo.revision }}
    path: stack/networking/edge
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
    syncOptions:
      # A route may apply before its backend Service exists.
      - SkipDryRunOnMissingResource=true
