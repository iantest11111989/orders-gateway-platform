# Trivy Operator values, sized for the budget: one shared Trivy server holds
# the DB, and one scan Job runs at a time.

operator:
  scanJobsConcurrentLimit: 1
  scanJobTimeout: 10m
  # Only image vulnerabilities and config audit; the rest is off to save resources.
  vulnerabilityScannerEnabled: true
  configAuditScannerEnabled: true
  rbacAssessmentScannerEnabled: false
  infraAssessmentScannerEnabled: false
  clusterComplianceEnabled: false
  exposedSecretScannerEnabled: false
  sbomGenerationEnabled: false
  builtInTrivyServer: true

# Docker Hub is an approved registry; the chart defaults to mirror.gcr.io.
image:
  registry: docker.io
  repository: aquasec/trivy-operator

# ~220Mi while scanning (it caches every report).
resources:
  requests: {cpu: 25m, memory: 192Mi}
  limits: {memory: 384Mi}

# Pod Security "restricted" is enforced on trivy-system.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  seccompProfile: {type: RuntimeDefault}

trivyOperator:
  scanJobPodTemplatePodSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile: {type: RuntimeDefault}

serviceMonitor:
  enabled: true

trivy:
  image:
    registry: docker.io
    repository: aquasec/trivy
  # Report everything; dashboards and alerts look at fixable HIGH/CRITICAL.
  severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
  # Helm merges this map into the chart's default (limits.cpu 500m), which
  # throttled the first scans into CPUThrottlingHigh: `cpu: null` removes it.
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: null, memory: 512Mi}
  # DB on an emptyDir: re-downloaded after a restart (~1 min), no PV needed.
  storageClassEnabled: false
  server:
    resources:
      requests: {cpu: 50m, memory: 384Mi}
      limits: {memory: 768Mi}
    podSecurityContext:
      runAsUser: 65534
      runAsNonRoot: true
      fsGroup: 65534
      seccompProfile: {type: RuntimeDefault}
    securityContext:
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: {drop: [ALL]}
