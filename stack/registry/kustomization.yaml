# The in-stack registry for app images and OCI charts. Applied by
# scripts/registry.sh before Argo CD exists.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: registry
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: platform-demo
    includeSelectors: false
