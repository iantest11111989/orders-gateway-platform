# Kyverno admission controller (stack/kyverno/values.yaml). Wave 20, not 10:
# its sync is slow and nothing before the policies (wave 30) needs it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform-demo
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/manifest-generate-paths: "/stack/kyverno"
spec:
  project: default
  sources:
    - repoURL: https://kyverno.github.io/kyverno/
      chart: kyverno
      targetRevision: 3.10.0 # Kyverno v1.20.0
      helm:
        releaseName: kyverno
        valueFiles:
          - $values/stack/kyverno/values.yaml
    - repoURL: {{ .Values.repo.url }}
      targetRevision: {{ .Values.repo.revision }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
    syncOptions:
      - CreateNamespace=true
      # Kyverno's CRDs are too large for client-side apply's annotation.
      - ServerSideApply=true
