# Argo CD manages itself after ./platform up installs it once with Helm.
# No resources-finalizer: deleting this Application must never delete Argo CD.
# Chart version and values must match scripts/argocd-bootstrap.sh.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform-demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/manifest-generate-paths: "/stack/argocd"
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.18.2
      helm:
        releaseName: argocd
        valueFiles:
          - $values/stack/argocd/values.yaml
    - repoURL: {{ .Values.repo.url }}
      targetRevision: {{ .Values.repo.revision }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
    syncOptions:
      - ServerSideApply=true
      # ServiceMonitor CRDs may not exist yet on a fresh cluster.
      - SkipDryRunOnMissingResource=true
