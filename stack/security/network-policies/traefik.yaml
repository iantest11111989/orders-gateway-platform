# Baseline for traefik: deny ingress except from its own pods and the nodes.
# On kindnet a deny-all would also drop the control plane's traffic to pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: traefik
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: traefik
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-nodes
  namespace: traefik
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        # Outside the pod network: the nodes and the API server.
        - ipBlock: {cidr: 0.0.0.0/0, except: [10.244.0.0/16]}
---
# Prometheus scrapes Traefik's metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-metrics
  namespace: traefik
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - {port: 9100, protocol: TCP}
---
# Every entrypoint takes traffic from anywhere (host NodePorts, in-cluster callers).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-entrypoints
  namespace: traefik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: 18080, protocol: TCP} # prod
        - {port: 18081, protocol: TCP} # Argo CD
        - {port: 18082, protocol: TCP} # dev
        - {port: 18083, protocol: TCP} # staging
        - {port: 18084, protocol: TCP} # demo
        - {port: 13000, protocol: TCP} # Grafana
        - {port: 19090, protocol: TCP} # Prometheus
        - {port: 19093, protocol: TCP} # Alertmanager
