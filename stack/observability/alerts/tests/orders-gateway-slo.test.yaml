# promtool tests for stack/observability/alerts/orders-gateway-slo.yaml (scripts/test-alerts.sh).
# 1-minute samples: "0+600x90" grows by 600/min (10 req/s) for 90 minutes.
rule_files:
  - ../../../../.build/alerts/orders-gateway-slo.rules.yaml

evaluation_interval: 30s

tests:
  # 9% errors (~18x budget): fast burn pages; slow burn waits out its 15m "for".
  - name: availability fast burn
    interval: 1m
    input_series:
      - series: 'http_requests_total{service="orders-gateway", namespace="prod", route="/work", method="GET", status="200"}'
        values: '0+600x90'
      - series: 'http_requests_total{service="orders-gateway", namespace="prod", route="/work", method="GET", status="500"}'
        values: '0+60x90'
    promql_expr_test:
      - expr: round(slo:orders_availability_errors:ratio_rate5m, 0.0001)
        eval_time: 10m
        exp_samples:
          - labels: '{service="orders-gateway", namespace="prod"}'
            value: 0.0909
    alert_rule_test:
      - eval_time: 10m
        alertname: OrdersGatewayAvailabilityFastBurn
        exp_alerts:
          - exp_labels: {service: orders-gateway, namespace: prod, severity: page, slo: orders-availability}
            exp_annotations:
              summary: "orders-gateway in prod is burning its availability error budget fast"
              description: "9.091% of /work and /echo requests failed with 5xx over the last hour (the SLO allows 0.5%). At this rate the whole 30-day error budget is gone in about 2 days."
              runbook_url: https://github.com/iantest11111989/platform-demo/blob/main/stack/observability/runbooks/OrdersGatewayAvailabilityFastBurn.md
      - eval_time: 10m
        alertname: OrdersGatewayAvailabilitySlowBurn
        exp_alerts: []
      - eval_time: 30m
        alertname: OrdersGatewayAvailabilitySlowBurn
        exp_alerts:
          - exp_labels: {service: orders-gateway, namespace: prod, severity: ticket, slo: orders-availability}
            exp_annotations:
              summary: "orders-gateway in prod is steadily burning its availability error budget"
              description: "9.091% of /work and /echo requests failed with 5xx over the last 6 hours (the SLO allows 0.5%). At this rate the 30-day error budget is gone in about 5 days."
              runbook_url: https://github.com/iantest11111989/platform-demo/blob/main/stack/observability/runbooks/OrdersGatewayAvailabilitySlowBurn.md
      - eval_time: 30m
        alertname: OrdersGatewayLatencyFastBurn
        exp_alerts: []

  # 4.8% of valid requests fail: slow burn only. Equal 4xx traffic would halve
  # the ratio if counted, so this proves 4xx are excluded.
  - name: availability slow burn, 4xx excluded
    interval: 1m
    input_series:
      - series: 'http_requests_total{service="orders-gateway", namespace="staging", route="/work", method="GET", status="200"}'
        values: '0+600x90'
      - series: 'http_requests_total{service="orders-gateway", namespace="staging", route="/echo", method="GET", status="404"}'
        values: '0+600x90'
      - series: 'http_requests_total{service="orders-gateway", namespace="staging", route="/work", method="GET", status="500"}'
        values: '0+30x90'
    promql_expr_test:
      - expr: round(slo:orders_availability_errors:ratio_rate30m, 0.0001)
        eval_time: 40m
        exp_samples:
          - labels: '{service="orders-gateway", namespace="staging"}'
            value: 0.0476
    alert_rule_test:
      - eval_time: 40m
        alertname: OrdersGatewayAvailabilitySlowBurn
        exp_alerts:
          - exp_labels: {service: orders-gateway, namespace: staging, severity: ticket, slo: orders-availability}
            exp_annotations:
              summary: "orders-gateway in staging is steadily burning its availability error budget"
              description: "4.762% of /work and /echo requests failed with 5xx over the last 6 hours (the SLO allows 0.5%). At this rate the 30-day error budget is gone in about 5 days."
              runbook_url: https://github.com/iantest11111989/platform-demo/blob/main/stack/observability/runbooks/OrdersGatewayAvailabilitySlowBurn.md
      - eval_time: 40m
        alertname: OrdersGatewayAvailabilityFastBurn
        exp_alerts: []

  # 1 in 6 /echo slower than 250 ms: latency fast burn. Slow /work doesn't count.
  - name: latency fast burn
    interval: 1m
    input_series:
      - series: 'http_requests_total{service="orders-gateway", namespace="prod", route="/work", method="GET", status="200"}'
        values: '0+600x90'
      - series: 'http_request_duration_seconds_bucket{service="orders-gateway", namespace="prod", route="/echo", le="0.25"}'
        values: '0+500x90'
      - series: 'http_request_duration_seconds_bucket{service="orders-gateway", namespace="prod", route="/echo", le="+Inf"}'
        values: '0+600x90'
      - series: 'http_request_duration_seconds_count{service="orders-gateway", namespace="prod", route="/echo"}'
        values: '0+600x90'
      - series: 'http_request_duration_seconds_bucket{service="orders-gateway", namespace="prod", route="/work", le="0.25"}'
        values: '0+0x90'
      - series: 'http_request_duration_seconds_count{service="orders-gateway", namespace="prod", route="/work"}'
        values: '0+600x90'
    promql_expr_test:
      - expr: round(slo:orders_latency_errors:ratio_rate5m, 0.0001)
        eval_time: 10m
        exp_samples:
          - labels: '{service="orders-gateway", namespace="prod"}'
            value: 0.1667
    alert_rule_test:
      - eval_time: 10m
        alertname: OrdersGatewayLatencyFastBurn
        exp_alerts:
          - exp_labels: {service: orders-gateway, namespace: prod, severity: page, slo: orders-latency}
            exp_annotations:
              summary: "orders-gateway in prod is burning its latency error budget fast"
              description: "16.67% of /echo and /version requests took longer than 250 ms over the last hour (the SLO allows 0.5%). At this rate the whole 30-day error budget is gone in about 2 days."
              runbook_url: https://github.com/iantest11111989/platform-demo/blob/main/stack/observability/runbooks/OrdersGatewayLatencyFastBurn.md
      - eval_time: 10m
        alertname: OrdersGatewayAvailabilityFastBurn
        exp_alerts: []

  # A short error blip in prod ends before the long windows notice. Nothing fires.
  - name: healthy and short blip
    interval: 1m
    input_series:
      - series: 'http_requests_total{service="orders-gateway", namespace="dev", route="/work", method="GET", status="200"}'
        values: '0+600x90'
      - series: 'http_request_duration_seconds_bucket{service="orders-gateway", namespace="dev", route="/echo", le="0.25"}'
        values: '0+600x90'
      - series: 'http_request_duration_seconds_count{service="orders-gateway", namespace="dev", route="/echo"}'
        values: '0+600x90'
      - series: 'http_requests_total{service="orders-gateway", namespace="prod", route="/work", method="GET", status="200"}'
        values: '0+600x90'
      # 2 minutes of 50% errors at minute 60-62, then none.
      - series: 'http_requests_total{service="orders-gateway", namespace="prod", route="/work", method="GET", status="500"}'
        values: '0x60 600 1200 1200x28'
    promql_expr_test:
      - expr: slo:orders_availability_errors:ratio_rate5m{namespace="dev"}
        eval_time: 30m
        exp_samples:
          - labels: 'slo:orders_availability_errors:ratio_rate5m{service="orders-gateway", namespace="dev"}'
            value: 0
    alert_rule_test:
      - eval_time: 30m
        alertname: OrdersGatewayAvailabilityFastBurn
        exp_alerts: []
      - eval_time: 30m
        alertname: OrdersGatewayLatencyFastBurn
        exp_alerts: []
      - eval_time: 80m
        alertname: OrdersGatewayAvailabilityFastBurn
        exp_alerts: []
      - eval_time: 80m
        alertname: OrdersGatewayAvailabilitySlowBurn
        exp_alerts: []

  # Another app's errors in the same namespace don't count.
  - name: another app's errors don't burn orders-gateway's budget
    interval: 1m
    input_series:
      - series: 'http_requests_total{service="orders-gateway", namespace="prod", route="/work", method="GET", status="200"}'
        values: '0+600x90'
      - series: 'http_requests_total{service="hello-world", namespace="prod", route="/work", method="GET", status="500"}'
        values: '0+600x90'
      - series: 'http_request_duration_seconds_bucket{service="orders-gateway", namespace="prod", route="/version", le="0.25"}'
        values: '0+600x90'
      - series: 'http_request_duration_seconds_count{service="orders-gateway", namespace="prod", route="/version"}'
        values: '0+600x90'
      - series: 'http_request_duration_seconds_bucket{service="hello-world", namespace="prod", route="/version", le="0.25"}'
        values: '0+0x90'
      - series: 'http_request_duration_seconds_count{service="hello-world", namespace="prod", route="/version"}'
        values: '0+600x90'
    alert_rule_test:
      - {eval_time: 60m, alertname: OrdersGatewayAvailabilityFastBurn, exp_alerts: []}
      - {eval_time: 60m, alertname: OrdersGatewayLatencyFastBurn, exp_alerts: []}
