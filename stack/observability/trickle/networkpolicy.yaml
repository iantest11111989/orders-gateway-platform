# No ingress. Egress only to Traefik's env entrypoints and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trickle
  namespace: trickle
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: traefik}
      ports:
        - {port: 18080, protocol: TCP}
        - {port: 18082, protocol: TCP}
        - {port: 18083, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
