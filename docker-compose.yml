# docker compose up -d --wait: brings up the whole platform. `ready` runs the
# toolbox, bootstraps kind and Argo CD, and turns healthy only when every
# Application is Synced and Healthy and prod serves.
# step-1..4 do no work: their healthchecks just show progress, since `--wait`
# prints only container states. Details: docker compose logs -f ready
# kind creates the node containers, so stop/start leaves the cluster intact;
# `./platform down` deletes it.
name: platform-demo

x-toolbox: &toolbox
  # Tag is a hash of stack/docker/ (checked by scripts/check-compose-toolbox.sh);
  # unpublished tags are built locally.
  image: ghcr.io/iantest11111989/orders-gateway-platform-toolbox:sha-9360654291fc
  build: ./stack/docker
  # Host network: the API server and platform ports are on the host's 127.0.0.1.
  network_mode: host
  working_dir: /work
  volumes:
    - .:/work
    - /var/run/docker.sock:/var/run/docker.sock  # kind creates its node containers
    - kube:/root/.kube
  init: true  # `sleep infinity` as PID 1 would ignore SIGTERM
  restart: unless-stopped

# Cheap (nothing once passed), and as patient as ready's.
x-step-health: &step-health
  interval: 30s
  timeout: 25s
  retries: 3
  start_period: 20m
  start_interval: 10s

services:
  step-1-cluster:
    <<: *toolbox
    command: ["sleep", "infinity"]
    healthcheck:
      <<: *step-health
      test: ["CMD", "bash", "scripts/compose-step.sh", "cluster"]

  step-2-argocd:
    <<: *toolbox
    command: ["sleep", "infinity"]
    healthcheck:
      <<: *step-health
      test: ["CMD", "bash", "scripts/compose-step.sh", "argocd"]

  step-3-platform:
    <<: *toolbox
    command: ["sleep", "infinity"]
    healthcheck:
      <<: *step-health
      test: ["CMD", "bash", "scripts/compose-step.sh", "platform"]

  step-4-apps:
    <<: *toolbox
    command: ["sleep", "infinity"]
    healthcheck:
      <<: *step-health
      test: ["CMD", "bash", "scripts/compose-step.sh", "apps"]

  ready:
    <<: *toolbox
    command: ["bash", "scripts/compose-ready.sh"]
    environment:
      PRELOAD_IMAGES: ${PRELOAD_IMAGES:-}  # CI's image cache (scripts/images.sh)
    healthcheck:
      test: ["CMD", "bash", "scripts/ready-check.sh"]
      interval: 30s
      timeout: 25s
      retries: 3
      start_period: 20m
      start_interval: 10s

volumes:
  kube:
    name: platform-demo-kube  # the same volume ./platform uses, so both see one kubeconfig
