# docker compose up -d --wait   brings up the whole platform (README, Quick start).
#
# Compose is only the outer shell: the one service that does the work, `ready`,
# runs the toolbox (every pinned tool) and bootstraps a kind cluster in which
# Argo CD installs everything else from Git (decision 0026). Its healthcheck
# passes only when every Argo CD Application is Synced and Healthy and prod is
# serving, so `--wait` returns when the platform is really up.
#
# step-1 to step-4 do no work: they show progress. `up -d --wait` prints only
# each container's state, so on its own `ready` reads "Waiting" for the whole
# start (about 9 minutes). Each step turns Healthy when one stage is done
# (scripts/compose-step.sh), so the stages tick off as they finish. For every
# detail as it happens: docker compose logs -f ready
#
# The kind node containers are created by kind, not by Compose: `docker compose
# stop`/`start` only restarts these containers; `ready` re-runs the (idempotent)
# bootstrap against the running cluster, so the cluster and its data are
# untouched. `./platform down` deletes the cluster.
name: orders-gateway-platform

# What every service shares: the toolbox image, the checkout, the kubeconfig.
x-toolbox: &toolbox
  # The toolbox image ./platform uses: its tag is a hash of toolbox/
  # (scripts/check-compose-toolbox.sh keeps the two in step, in CI).
  # If the tag isn't published yet (a branch that changes toolbox/),
  # Compose builds it from toolbox/.
  image: ghcr.io/iantest11111989/orders-gateway-platform-toolbox:sha-8ff4ca6604ba
  build: ./toolbox
  # Host network: kind's API server and the platform's ports are on the
  # host's 127.0.0.1, so ./out/kubeconfig.yaml works from the host as is.
  network_mode: host
  working_dir: /work
  volumes:
    - .:/work
    - /var/run/docker.sock:/var/run/docker.sock  # kind creates its node containers
    - kube:/root/.kube
  init: true  # `sleep infinity` as PID 1 would ignore SIGTERM
  restart: unless-stopped

# A step's healthcheck: cheap (a kubectl call or two, nothing once passed),
# and as patient as ready's.
x-step-health: &step-health
  interval: 30s
  timeout: 25s
  retries: 3
  start_period: 20m
  start_interval: 10s

services:
  step-1-cluster:
    <<: *toolbox
    command: ["sleep", "infinity"]
    healthcheck:
      <<: *step-health
      test: ["CMD", "bash", "scripts/compose-step.sh", "cluster"]

  step-2-argocd:
    <<: *toolbox
    command: ["sleep", "infinity"]
    healthcheck:
      <<: *step-health
      test: ["CMD", "bash", "scripts/compose-step.sh", "argocd"]

  step-3-platform:
    <<: *toolbox
    command: ["sleep", "infinity"]
    healthcheck:
      <<: *step-health
      test: ["CMD", "bash", "scripts/compose-step.sh", "platform"]

  step-4-apps:
    <<: *toolbox
    command: ["sleep", "infinity"]
    healthcheck:
      <<: *step-health
      test: ["CMD", "bash", "scripts/compose-step.sh", "apps"]

  ready:
    <<: *toolbox
    command: ["bash", "scripts/compose-ready.sh"]
    environment:
      REPO_URL: ${REPO_URL:-}
      REVISION: ${REVISION:-}
      PRELOAD_IMAGES: ${PRELOAD_IMAGES:-}  # CI's image cache (scripts/images.sh)
    healthcheck:
      test: ["CMD", "bash", "scripts/ready-check.sh"]
      interval: 30s
      timeout: 25s
      retries: 3
      # A cold start pulls about 60 images; the brief allows 15 minutes.
      start_period: 20m
      start_interval: 10s

volumes:
  kube:
    name: ogp-kube  # the same volume ./platform uses, so both see one kubeconfig
